# Render Blueprint — production + isolated demo environment.
# After push: Dashboard → Blueprint → sync. Demo is a separate web service + Postgres.
#
# PRODUCTION: fleet-manager + company-management-db (real data, Ufone bridge ON)
# DEMO:       fleet-manager-demo + fleet-demo-db (sample data, bridge OFF)
#
# Demo login (after seed / clone): Master `demo` / `Demo#2026`
# See docs/DEMO_ENVIRONMENT.md
#
# ═══════════════════════════════════════════════════════════════════════
# INFRA CONTEXT (for future AI sessions / devs):
# This service currently runs on the Render "Starter" plan ($7/mo, ~512MB RAM),
# NOT the free tier. Starter does NOT spin down after 15 min idle, so the mobile
# app opens without a cold-start delay. The `plan: starter` field below reflects
# the live configuration. If you switch tiers, update BOTH this field AND the
# gunicorn worker count (workers=2 may OOM on 512MB; safe at 1).
# ═══════════════════════════════════════════════════════════════════════
version: "1"
databases:
  - name: company-management-db
    databaseName: company_management
    user: company_app
    plan: starter
  - name: fleet-demo-db
    databaseName: fleet_demo
    user: fleet_demo_app
    plan: starter
services:
  - type: web
    name: fleet-manager
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt && python -m playwright install --with-deps chromium
    # Matches Procfile; bind 0.0.0.0:$PORT per https://render.com/docs/web-services#port-binding
    # Starter ~512MB: use 1 worker so backup + Flask stays under RAM (was OOM with workers=2)
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 600 --workers 1 --worker-class gthread --threads 4
    preDeployCommand: sh scripts/render_migrate.sh
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: company-management-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_APP
        value: app:app
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: DEMO_MODE
        value: "0"
      - key: BACKUP_INCLUDE_UPLOADS
        value: "false"
      - key: BACKUP_EXCLUDE_TABLES
        value: activity_log,client_activity_log,login_log,login_attempt
      - key: BACKUP_COMPACT
        value: "true"
      # Ufone PK VPS bridge — set UFONE_BRIDGE_TOKEN in Dashboard (secret)
      - key: UFONE_BRIDGE_ONLY
        value: "1"
      - key: UFONE_BRIDGE_TOKEN
        sync: false

  - type: web
    name: fleet-manager-demo
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 600 --workers 1 --worker-class gthread --threads 4
    preDeployCommand: sh scripts/render_migrate.sh
    # First successful deploy only — also re-runs idempotently on boot when DEMO_MODE=1
    initialDeployHook: sh scripts/seed_demo.sh
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fleet-demo-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_APP
        value: app:app
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: DEMO_MODE
        value: "1"
      - key: BACKUP_INCLUDE_UPLOADS
        value: "false"
      - key: BACKUP_EXCLUDE_TABLES
        value: activity_log,client_activity_log,login_log,login_attempt
      - key: BACKUP_COMPACT
        value: "true"
      # Keep bridge-only UI paths stable, but never accept VPS ingest (no token + DEMO_MODE block)
      - key: UFONE_BRIDGE_ONLY
        value: "1"
      # Intentionally unset — do not paste production UFONE_BRIDGE_TOKEN here
