<!DOCTYPE html>
<html lang="en" class="capacitor-native">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Notification</title>
  <style>
    :root {
      --scrim: rgba(2, 6, 23, 0.42);
      --sheet: rgba(10, 18, 34, 0.97);
      --sheet-top: rgba(17, 24, 39, 0.92);
      --line: rgba(148, 163, 184, 0.16);
      --text: #e5eefb;
      --muted: #9fb0c9;
      --btn: #13243c;
      --btn2: linear-gradient(135deg, #0ea5e9, #2563eb);
      --shadow: 0 -12px 44px rgba(2, 6, 23, 0.58);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: transparent;
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    body { overflow: hidden; }
    .overlay {
      min-height: 100%;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-top: max(12vh, env(safe-area-inset-top));
      background:
        radial-gradient(circle at top, rgba(14,165,233,.14), transparent 32%),
        linear-gradient(180deg, rgba(4, 9, 18, 0.10), var(--scrim));
    }
    .shell {
      width: min(100%, 640px);
      padding: 0 10px calc(10px + env(safe-area-inset-bottom));
    }
    .sheet {
      position: relative;
      border: 1px solid var(--line);
      border-radius: 30px 30px 0 0;
      background:
        linear-gradient(180deg, rgba(56,189,248,.12), rgba(15,23,42,0) 26%),
        linear-gradient(180deg, var(--sheet-top), var(--sheet));
      backdrop-filter: blur(18px);
      box-shadow: var(--shadow);
      overflow: hidden;
      transform: translateY(34px);
      opacity: 0;
      animation: sheetUp .26s ease-out forwards;
    }
    @keyframes sheetUp {
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }
    .handle-wrap {
      display: flex;
      justify-content: center;
      padding: 10px 0 4px;
    }
    .handle {
      width: 52px;
      height: 5px;
      border-radius: 999px;
      background: rgba(191, 219, 254, 0.28);
    }
    .hero {
      padding: 14px 22px 18px;
      border-bottom: 1px solid var(--line);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 12px;
      color: #cfe8ff;
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid rgba(125, 211, 252, .16);
      letter-spacing: .02em;
    }
    .title {
      margin: 14px 0 10px;
      font-size: 24px;
      line-height: 1.15;
      font-weight: 800;
    }
    .meta {
      color: var(--muted);
      font-size: 13px;
    }
    .content {
      padding: 20px 22px 12px;
      max-height: 54vh;
      overflow-y: auto;
    }
    .message {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.6;
      font-size: 15px;
      color: #e8f0fd;
    }
    .footer {
      display: flex;
      gap: 12px;
      padding: 16px 22px calc(18px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--line);
      background: rgba(8, 15, 29, 0.82);
    }
    .btn {
      appearance: none;
      border: 0;
      border-radius: 16px;
      padding: 15px 18px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      flex: 1;
    }
    .btn-cancel {
      color: #f8fafc;
      background: var(--btn);
      border: 1px solid rgba(148,163,184,.18);
    }
    .btn-save {
      color: white;
      background: var(--btn2);
      box-shadow: 0 14px 30px rgba(37,99,235,.35);
    }
    .btn-save[disabled] {
      cursor: not-allowed;
      opacity: .45;
      box-shadow: none;
      background: #23334a;
    }
    .status {
      margin-top: 14px;
      font-size: 13px;
      color: var(--muted);
      min-height: 18px;
    }
    .loading, .error {
      padding: 28px 24px 34px;
      text-align: center;
      color: var(--muted);
    }
    .close-mini {
      position: absolute;
      top: 12px;
      right: 14px;
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 999px;
      color: #dbeafe;
      background: rgba(15, 23, 42, 0.72);
      font-size: 18px;
      cursor: pointer;
    }
    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(24px + env(safe-area-inset-bottom));
      transform: translateX(-50%) translateY(16px);
      min-width: 220px;
      max-width: calc(100% - 32px);
      padding: 12px 16px;
      border-radius: 14px;
      background: rgba(15, 23, 42, 0.96);
      border: 1px solid rgba(56, 189, 248, 0.24);
      color: #dbeafe;
      text-align: center;
      font-size: 14px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s ease, transform .18s ease;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <div class="overlay" id="overlay">
    <div class="shell">
      <div class="sheet" id="popupCard">
        <button class="close-mini" id="topCloseBtn" type="button" aria-label="Close">x</button>
        <div class="handle-wrap"><div class="handle"></div></div>
        <div class="loading" id="loadingState">Loading notification...</div>
        <div id="popupBody" hidden>
          <div class="hero">
            <div class="badge" id="popupBadge">Notification</div>
            <div class="title" id="popupTitle"></div>
            <div class="meta" id="popupMeta"></div>
          </div>
          <div class="content">
            <p class="message" id="popupMessage"></p>
            <div class="status" id="popupStatus"></div>
          </div>
          <div class="footer">
            <button class="btn btn-cancel" id="cancelBtn" type="button">Cancel</button>
            <button class="btn btn-save" id="saveBtn" type="button" disabled>Save</button>
          </div>
        </div>
        <div class="error" id="errorState" hidden>
          <div>Notification unavailable or expired.</div>
          <div style="margin-top:16px;">
            <button class="btn btn-cancel" id="errorCloseBtn" type="button">Close</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="toast" id="saveToast" hidden></div>
  <script>
    (function() {
      var token = {{ popup_token|tojson }};
      var initialNotification = {{ initial_notification|tojson }};
      var apiUrl = '/api/public/notification-popup?t=' + encodeURIComponent(token);
      var overlay = document.getElementById('overlay');
      var loading = document.getElementById('loadingState');
      var popupBody = document.getElementById('popupBody');
      var errorState = document.getElementById('errorState');
      var badge = document.getElementById('popupBadge');
      var title = document.getElementById('popupTitle');
      var meta = document.getElementById('popupMeta');
      var message = document.getElementById('popupMessage');
      var status = document.getElementById('popupStatus');
      var saveBtn = document.getElementById('saveBtn');
      var cancelBtn = document.getElementById('cancelBtn');
      var errorCloseBtn = document.getElementById('errorCloseBtn');
      var topCloseBtn = document.getElementById('topCloseBtn');
      var popupCard = document.getElementById('popupCard');
      var saveToast = document.getElementById('saveToast');
      var currentData = null;
      var toastTimer = null;

      function showToast(text) {
        if (!text) return;
        if (toastTimer) window.clearTimeout(toastTimer);
        saveToast.textContent = text;
        saveToast.hidden = false;
        requestAnimationFrame(function() {
          saveToast.classList.add('show');
        });
        toastTimer = window.setTimeout(function() {
          saveToast.classList.remove('show');
          window.setTimeout(function() {
            saveToast.hidden = true;
          }, 220);
        }, 1800);
      }

      function renderNotification(data) {
        currentData = data;
        loading.hidden = true;
        popupBody.hidden = false;
        badge.textContent = currentData.source === 'ufone_task_event' ? 'Task Notification' : 'Notification';
        title.textContent = currentData.title || 'Notification';
        meta.textContent = currentData.created_at ? ('Received: ' + currentData.created_at) : 'Fleet Manager';
        message.textContent = currentData.message || '';
        saveBtn.disabled = !currentData.save_enabled;
        status.textContent = currentData.save_enabled ? 'Save will export this popup card to your gallery.' : 'Save is disabled for this notification type.';
      }

      function closeApp() {
        try {
          if (window._fleetNative && typeof window._fleetNative.closeNotificationPopup === 'function') {
            window._fleetNative.closeNotificationPopup();
            return;
          }
        } catch (e) {}
        try { window.close(); } catch (e) {}
      }

      function saveCard() {
        if (!currentData || !currentData.save_enabled) return;
        status.textContent = 'Saving...';
        try {
          if (window._fleetNative && typeof window._fleetNative.saveNotificationCard === 'function') {
            var result = window._fleetNative.saveNotificationCard(JSON.stringify(currentData));
            var messageText = result || 'Saved to gallery.';
            status.textContent = messageText;
            showToast(messageText);
            return;
          }
          status.textContent = 'Save is only available in the Android app.';
        } catch (e) {
          status.textContent = 'Save failed. Please try again.';
        }
      }

      cancelBtn.addEventListener('click', closeApp);
      errorCloseBtn.addEventListener('click', closeApp);
      topCloseBtn.addEventListener('click', closeApp);
      saveBtn.addEventListener('click', saveCard);
      overlay.addEventListener('click', function(e) {
        if (e.target === overlay) closeApp();
      });
      popupCard.addEventListener('click', function(e) {
        e.stopPropagation();
      });

      if (initialNotification) {
        renderNotification(initialNotification);
        return;
      }

      fetch(apiUrl, { credentials: 'omit' })
        .then(function(r) { return r.json().then(function(j) { return { ok: r.ok, data: j }; }); })
        .then(function(res) {
          if (!res.ok || !res.data || !res.data.ok || !res.data.notification) {
            throw new Error('invalid');
          }
          renderNotification(res.data.notification);
        })
        .catch(function() {
          loading.hidden = true;
          errorState.hidden = false;
        });
    })();
  </script>
</body>
</html>
