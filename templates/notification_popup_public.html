<!DOCTYPE html>
<html lang="en" class="capacitor-native">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Notification</title>
  <style>
    :root {
      --scrim: rgba(15, 23, 42, 0.48);
      --sheet: #ffffff;
      --line: #eef2f7;
      --text: #0f172a;
      --muted: #64748b;
      --label: #334155;
      --btn-cancel: #f1f5f9;
      --btn-save: #2563eb;
      --shadow: 0 -18px 50px rgba(15, 23, 42, 0.28);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: transparent;
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    body { overflow: hidden; }
    .overlay {
      min-height: 100%;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-top: max(10vh, env(safe-area-inset-top));
      background:
        radial-gradient(circle at 50% 18%, rgba(37,99,235,.18), transparent 42%),
        linear-gradient(180deg, rgba(15,23,42,.18), var(--scrim));
    }
    .shell {
      width: min(100%, 640px);
      padding: 0 10px calc(8px + env(safe-area-inset-bottom));
    }
    .sheet {
      position: relative;
      border-radius: 28px 28px 18px 18px;
      background: var(--sheet);
      box-shadow: var(--shadow);
      overflow: hidden;
      transform: translateY(28px);
      opacity: 0;
      animation: sheetUp .26s ease-out forwards;
    }
    @keyframes sheetUp {
      to { transform: translateY(0); opacity: 1; }
    }
    .handle-wrap { display: flex; justify-content: center; padding: 10px 0 2px; }
    .handle {
      width: 44px; height: 5px; border-radius: 999px; background: #dbe3ee;
    }
    .close-mini {
      position: absolute; top: 12px; right: 12px;
      width: 34px; height: 34px; border: 0; border-radius: 999px;
      color: #64748b; background: #f1f5f9; font-size: 18px; cursor: pointer;
    }
    .hero {
      padding: 8px 22px 16px;
      border-bottom: 1px solid var(--line);
    }
    .badge {
      display: inline-flex; align-items: center;
      padding: 6px 11px; border-radius: 999px;
      font-size: 12px; font-weight: 700;
      color: #1d4ed8; background: #eff6ff;
    }
    .title {
      margin: 12px 0 6px;
      font-size: 24px; line-height: 1.2; font-weight: 800; color: #0f172a;
    }
    .meta { color: var(--muted); font-size: 13px; }
    .content {
      padding: 8px 14px 4px;
      max-height: 52vh;
      overflow-y: auto;
    }
    .lead {
      margin: 8px 8px 12px;
      padding: 12px 14px;
      border-radius: 14px;
      background: #f8fafc;
      color: #334155;
      font-size: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
    }
    .lead[hidden], .fields[hidden], .plain[hidden] { display: none !important; }
    .fields { display: flex; flex-direction: column; gap: 4px; }
    .row {
      display: flex; align-items: flex-start; gap: 12px;
      padding: 10px 8px; border-radius: 14px;
    }
    .row:nth-child(odd) { background: #f8fafc; }
    .icon {
      width: 38px; height: 38px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; font-size: 16px;
    }
    .icon.cal { background: #ede9fe; color: #6d28d9; }
    .icon.tag { background: #fef3c7; color: #b45309; }
    .icon.phone { background: #fce7f3; color: #be185d; }
    .icon.user { background: #ede9fe; color: #7c3aed; }
    .icon.pin { background: #fee2e2; color: #dc2626; }
    .icon.flag { background: #e2e8f0; color: #0f172a; }
    .icon.amb { background: #dcfce7; color: #15803d; }
    .icon.cat { background: #e0e7ff; color: #4338ca; }
    .icon.done { background: #dbeafe; color: #1d4ed8; }
    .icon.info { background: #e2e8f0; color: #475569; }
    .row-body { min-width: 0; flex: 1; padding-top: 1px; }
    .row-label {
      font-size: 12px; font-weight: 700; color: var(--label); margin-bottom: 2px;
    }
    .row-value {
      font-size: 14px; line-height: 1.4; color: #0f172a;
      word-break: break-word;
    }
    .plain {
      margin: 10px 8px 14px;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.6;
      font-size: 15px;
      color: #1e293b;
    }
    .footer {
      display: flex; gap: 12px;
      padding: 12px 18px calc(16px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--line);
      background: #fff;
    }
    .btn {
      appearance: none; border: 0; border-radius: 16px;
      padding: 15px 18px; font-size: 15px; font-weight: 700;
      cursor: pointer; flex: 1;
    }
    .btn-cancel { color: #334155; background: var(--btn-cancel); }
    .btn-save {
      color: #fff; background: var(--btn-save);
      box-shadow: 0 10px 24px rgba(37,99,235,.28);
    }
    .btn-save[disabled] {
      cursor: not-allowed; opacity: .45; box-shadow: none; background: #94a3b8;
    }
    .status {
      margin: 4px 22px 0;
      font-size: 12px; color: var(--muted); font-style: italic; min-height: 16px;
    }
    .loading, .error {
      padding: 28px 24px 34px; text-align: center; color: var(--muted);
    }
    .toast {
      position: fixed; left: 50%;
      bottom: calc(24px + env(safe-area-inset-bottom));
      transform: translateX(-50%) translateY(16px);
      min-width: 220px; max-width: calc(100% - 32px);
      padding: 12px 16px; border-radius: 14px;
      background: rgba(15, 23, 42, 0.96);
      border: 1px solid rgba(56, 189, 248, 0.24);
      color: #dbeafe; text-align: center; font-size: 14px;
      opacity: 0; pointer-events: none;
      transition: opacity .18s ease, transform .18s ease;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <div class="overlay" id="overlay">
    <div class="shell">
      <div class="sheet" id="popupCard">
        <button class="close-mini" id="topCloseBtn" type="button" aria-label="Close">×</button>
        <div class="handle-wrap"><div class="handle"></div></div>
        <div class="loading" id="loadingState">Loading notification...</div>
        <div id="popupBody" hidden>
          <div class="hero">
            <div class="badge" id="popupBadge">Notification</div>
            <div class="title" id="popupTitle"></div>
            <div class="meta" id="popupMeta"></div>
          </div>
          <div class="content">
            <div class="lead" id="popupLead" hidden></div>
            <div class="fields" id="popupFields" hidden></div>
            <p class="plain" id="popupMessage" hidden></p>
          </div>
          <div class="status" id="popupStatus"></div>
          <div class="footer">
            <button class="btn btn-cancel" id="cancelBtn" type="button">Cancel</button>
            <button class="btn btn-save" id="saveBtn" type="button" disabled>Save</button>
          </div>
        </div>
        <div class="error" id="errorState" hidden>
          <div>Notification unavailable or expired.</div>
          <div style="margin-top:16px;">
            <button class="btn btn-cancel" id="errorCloseBtn" type="button">Close</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="toast" id="saveToast" hidden></div>
  <script>
    (function() {
      var token = {{ popup_token|tojson }};
      var initialNotification = {{ initial_notification|tojson }};
      var apiUrl = '/api/public/notification-popup?t=' + encodeURIComponent(token || '');
      var overlay = document.getElementById('overlay');
      var loading = document.getElementById('loadingState');
      var popupBody = document.getElementById('popupBody');
      var errorState = document.getElementById('errorState');
      var badge = document.getElementById('popupBadge');
      var title = document.getElementById('popupTitle');
      var meta = document.getElementById('popupMeta');
      var lead = document.getElementById('popupLead');
      var fieldsEl = document.getElementById('popupFields');
      var message = document.getElementById('popupMessage');
      var status = document.getElementById('popupStatus');
      var saveBtn = document.getElementById('saveBtn');
      var cancelBtn = document.getElementById('cancelBtn');
      var errorCloseBtn = document.getElementById('errorCloseBtn');
      var topCloseBtn = document.getElementById('topCloseBtn');
      var popupCard = document.getElementById('popupCard');
      var saveToast = document.getElementById('saveToast');
      var currentData = null;
      var toastTimer = null;

      var FIELD_DEFS = [
        { key: 'CreateDateTime', label: 'CreateDateTime', icon: 'cal', emoji: '📅' },
        { key: 'Task Create Date/Time', label: 'CreateDateTime', icon: 'cal', emoji: '📅' },
        { key: 'Task ID', label: 'Task ID', icon: 'tag', emoji: '🏷️' },
        { key: 'Phone no', label: 'Phone No', icon: 'phone', emoji: '📞' },
        { key: 'Name', label: 'Name', icon: 'user', emoji: '👤' },
        { key: 'Ambulance', label: 'Ambulance', icon: 'amb', emoji: '🚑' },
        { key: 'Pickup', label: 'Pickup', icon: 'pin', emoji: '📍' },
        { key: 'Destination', label: 'Destination', icon: 'flag', emoji: '🏁' },
        { key: 'Close Category', label: 'Close Category', icon: 'cat', emoji: '📁' },
        { key: 'Task Category', label: 'Close Category', icon: 'cat', emoji: '📁' },
        { key: 'CompletedDateTime', label: 'Completed', icon: 'done', emoji: '✅' }
      ];

      function showToast(text) {
        if (!text) return;
        if (toastTimer) window.clearTimeout(toastTimer);
        saveToast.textContent = text;
        saveToast.hidden = false;
        requestAnimationFrame(function() { saveToast.classList.add('show'); });
        toastTimer = window.setTimeout(function() {
          saveToast.classList.remove('show');
          window.setTimeout(function() { saveToast.hidden = true; }, 220);
        }, 1800);
      }

      function formatReceived(raw) {
        if (!raw) return 'Fleet Manager';
        var d = new Date(raw);
        if (isNaN(d.getTime())) {
          return 'Received: ' + String(raw).replace('T', ' ').replace(/\.\d+/, '');
        }
        try {
          return 'Received: ' + d.toLocaleString(undefined, {
            year: 'numeric', month: 'short', day: 'numeric',
            hour: '2-digit', minute: '2-digit'
          });
        } catch (e) {
          return 'Received: ' + raw;
        }
      }

      function displayTitle(raw) {
        if (raw === 'New Task Generate') return 'New Task Generated';
        return raw || 'Notification';
      }

      function parseFields(text) {
        var src = String(text || '').trim();
        if (!src) return { lead: '', rows: [], leftover: '' };
        var map = {};
        var leadText = '';
        var keys = FIELD_DEFS.map(function(f) { return f.key; });
        var pattern = new RegExp(
          '(' + keys.map(function(k) {
            return k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          }).join('|') + ')\\s*:',
          'gi'
        );
        var matches = [];
        var m;
        while ((m = pattern.exec(src)) !== null) {
          matches.push({ key: m[1], index: m.index, end: m.index + m[0].length });
        }
        if (!matches.length) {
          return { lead: '', rows: [], leftover: src };
        }
        if (matches[0].index > 0) {
          leadText = src.slice(0, matches[0].index).trim().replace(/[.,;]+$/, '').trim();
        }
        for (var i = 0; i < matches.length; i++) {
          var start = matches[i].end;
          var stop = i + 1 < matches.length ? matches[i + 1].index : src.length;
          var value = src.slice(start, stop).replace(/^[\s,]+|[\s,]+$/g, '').trim();
          var canon = matches[i].key;
          for (var j = 0; j < FIELD_DEFS.length; j++) {
            if (FIELD_DEFS[j].key.toLowerCase() === canon.toLowerCase()) {
              canon = FIELD_DEFS[j].key;
              break;
            }
          }
          if (canon.toLowerCase() === 'phone no') {
            value = value.replace(/\s+CLI\s*:/i, ' | CLI: ');
          }
          map[canon] = value;
        }
        var rows = [];
        FIELD_DEFS.forEach(function(def) {
          if (map[def.key]) {
            rows.push({
              label: def.label,
              value: map[def.key],
              icon: def.icon,
              emoji: def.emoji
            });
          }
        });
        return { lead: leadText, rows: rows, leftover: rows.length ? '' : src };
      }

      function renderFields(parsed) {
        lead.hidden = true;
        fieldsEl.hidden = true;
        message.hidden = true;
        lead.textContent = '';
        fieldsEl.innerHTML = '';
        message.textContent = '';

        if (parsed.lead) {
          lead.textContent = parsed.lead;
          lead.hidden = false;
        }
        if (parsed.rows && parsed.rows.length) {
          parsed.rows.forEach(function(row) {
            var el = document.createElement('div');
            el.className = 'row';
            el.innerHTML =
              '<div class="icon ' + row.icon + '">' + row.emoji + '</div>' +
              '<div class="row-body">' +
                '<div class="row-label"></div>' +
                '<div class="row-value"></div>' +
              '</div>';
            el.querySelector('.row-label').textContent = row.label;
            el.querySelector('.row-value').textContent = row.value;
            fieldsEl.appendChild(el);
          });
          fieldsEl.hidden = false;
          return;
        }
        message.textContent = parsed.leftover || '';
        message.hidden = !message.textContent;
      }

      function readNativePayload() {
        try {
          if (window._fleetNative && typeof window._fleetNative.getNotificationPayload === 'function') {
            var raw = window._fleetNative.getNotificationPayload();
            if (raw) {
              var parsed = JSON.parse(raw);
              if (parsed && parsed.title) return parsed;
            }
          }
        } catch (e) {}
        return null;
      }

      function normalizePayload(data) {
        return {
          title: data.title || 'Notification',
          message: data.message || data.body || '',
          save_enabled: !!(data.save_enabled === true || data.save_enabled === '1' || data.save_enabled === 1),
          source: data.source || data.popup_source || 'generic',
          created_at: data.created_at || ''
        };
      }

      function renderNotification(data) {
        currentData = normalizePayload(data);
        loading.hidden = true;
        errorState.hidden = true;
        popupBody.hidden = false;
        badge.textContent = currentData.source === 'ufone_task_event' ? 'Task Notification' : 'Notification';
        title.textContent = displayTitle(currentData.title);
        meta.textContent = formatReceived(currentData.created_at);
        renderFields(parseFields(currentData.message));
        saveBtn.disabled = !currentData.save_enabled;
        status.textContent = currentData.save_enabled
          ? 'Save will export this popup card to your gallery.'
          : 'Save is disabled for this notification type.';
      }

      function closeApp() {
        try {
          if (window._fleetNative && typeof window._fleetNative.closeNotificationPopup === 'function') {
            window._fleetNative.closeNotificationPopup();
            return;
          }
        } catch (e) {}
        try { window.close(); } catch (e) {}
      }

      function saveCard() {
        if (!currentData || !currentData.save_enabled) return;
        status.textContent = 'Saving...';
        try {
          if (window._fleetNative && typeof window._fleetNative.saveNotificationCard === 'function') {
            var result = window._fleetNative.saveNotificationCard(JSON.stringify(currentData));
            var messageText = result || 'Saved to gallery.';
            status.textContent = messageText;
            showToast(messageText);
            return;
          }
          status.textContent = 'Save is only available in the Android app.';
        } catch (e) {
          status.textContent = 'Save failed. Please try again.';
        }
      }

      cancelBtn.addEventListener('click', closeApp);
      errorCloseBtn.addEventListener('click', closeApp);
      topCloseBtn.addEventListener('click', closeApp);
      saveBtn.addEventListener('click', saveCard);
      overlay.addEventListener('click', function(e) {
        if (e.target === overlay) closeApp();
      });
      popupCard.addEventListener('click', function(e) {
        e.stopPropagation();
      });

      var nativePayload = readNativePayload();
      if (nativePayload) {
        renderNotification(nativePayload);
      }
      if (initialNotification) {
        renderNotification(initialNotification);
        return;
      }
      if (nativePayload && !token) {
        return;
      }

      fetch(apiUrl, { credentials: 'omit' })
        .then(function(r) { return r.json().then(function(j) { return { ok: r.ok, data: j }; }); })
        .then(function(res) {
          if (!res.ok || !res.data || !res.data.ok || !res.data.notification) {
            throw new Error('invalid');
          }
          renderNotification(res.data.notification);
        })
        .catch(function() {
          if (currentData) return;
          loading.hidden = true;
          errorState.hidden = false;
        });
    })();
  </script>
</body>
</html>
