{# Sub-navigation bar shared by all Personal (Crescent) pages #}
<div class="ps-nav">
    <a href="{{ url_for('personal_dashboard') }}" class="ps-tab {% if request.endpoint == 'personal_dashboard' %}active{% endif %}"><i class="bi bi-speedometer2"></i> Dashboard</a>
    <a href="{{ url_for('personal_live') }}" class="ps-tab {% if request.endpoint == 'personal_live' %}active{% endif %}"><i class="bi bi-geo-alt"></i> Live Map</a>
    <a href="{{ url_for('personal_vehicles') }}" class="ps-tab {% if request.endpoint == 'personal_vehicles' or request.endpoint == 'personal_vehicle_detail' %}active{% endif %}"><i class="bi bi-car-front"></i> Vehicles</a>
    <a href="{{ url_for('personal_history') }}" class="ps-tab {% if request.endpoint == 'personal_history' %}active{% endif %}"><i class="bi bi-route"></i> History</a>
    <a href="{{ url_for('personal_trips') }}" class="ps-tab {% if request.endpoint == 'personal_trips' %}active{% endif %}"><i class="bi bi-signpost-split"></i> Trips</a>
    <a href="{{ url_for('personal_alarms') }}" class="ps-tab {% if request.endpoint == 'personal_alarms' %}active{% endif %}"><i class="bi bi-bell"></i> Alarms</a>
    <a href="{{ url_for('personal_notifications') }}" class="ps-tab {% if request.endpoint == 'personal_notifications' %}active{% endif %}"><i class="bi bi-chat-dots"></i> Notifications</a>
    <a href="{{ url_for('personal_settings') }}" class="ps-tab {% if request.endpoint == 'personal_settings' %}active{% endif %}"><i class="bi bi-gear"></i> Settings</a>
</div>

{% if not configured %}
<div class="alert alert-warning d-flex align-items-center gap-2 mt-2" role="alert">
    <i class="bi bi-exclamation-triangle"></i>
    <div>Crescent Tracker credentials configured nahi hain.
        <a href="{{ url_for('personal_settings') }}">Settings</a> mein username/password save karein.
    </div>
</div>
{% endif %}
