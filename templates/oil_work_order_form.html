{% extends "base.html" %}
{% block title %}{{ 'Edit' if rec else 'Add' }} Oil Work Order{% endblock %}
{% block content %}
<style>
  .owo-form-head { background: linear-gradient(135deg, #5b21b6 0%, #4338ca 100%); color:#fff; border-radius: 12px; padding: .65rem 1rem; }
</style>
<div class="container-fluid py-3">
  <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 owo-form-head">
    <h5 class="mb-0"><i class="bi bi-clipboard2-check me-2"></i>{{ 'Edit' if rec else 'Add' }} Oil Work Order</h5>
    <a href="{{ url_for('oil_work_order_list') }}" class="btn btn-outline-light btn-sm">Back to Work Orders</a>
  </div>

  <div class="card">
    <div class="card-body">
      <script type="application/json" id="locationCascadeData">{{ location_cascade|tojson }}</script>
      <form method="POST" action="">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="row g-3">
          <div class="col-md-3">
            <label class="form-label">Work Order No</label>
            <input type="text" class="form-control" value="{{ rec.work_order_no if rec else 'Auto-generated on save' }}" readonly>
          </div>
          <div class="col-md-3">
            <label class="form-label">Opened On <span class="text-danger">*</span></label>
            <input type="text" name="opened_on" class="form-control datepicker" value="{{ rec.opened_on|ddmmyyyy if rec and rec.opened_on else '' }}" required>
          </div>
          <div class="col-md-3">
            <label class="form-label">Closed On</label>
            <input type="text" name="closed_on" class="form-control datepicker" value="{{ rec.closed_on|ddmmyyyy if rec and rec.closed_on else '' }}">
          </div>
          <div class="col-md-3">
            <label class="form-label">Status</label>
            {% set st = rec.status if rec else 'open' %}
            <select name="status" class="form-select search-select">
              <option value="open" {% if st == 'open' %}selected{% endif %}>Open</option>
              <option value="in_progress" {% if st == 'in_progress' %}selected{% endif %}>In Progress</option>
              <option value="closed" {% if st == 'closed' %}selected{% endif %}>Closed</option>
            </select>
          </div>

          <div class="col-md-4">
            <label class="form-label">District</label>
            <select name="district_id" id="districtSelect" class="form-select search-select">
              <option value="0">-- Select District --</option>
              {% for d in districts %}
              <option value="{{ d.id }}" {% if (selected_district_id or 0) == d.id %}selected{% endif %}>{{ d.name }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label">Project</label>
            <select name="project_id" id="projectSelect" class="form-select search-select">
              <option value="0">-- Select Project --</option>
              {% for p in projects %}
              <option value="{{ p.id }}" {% if (selected_project_id or 0) == p.id %}selected{% endif %}>{{ p.name }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label">Vehicle <span class="text-danger">*</span></label>
            <select name="vehicle_id" id="vehicleSelect" class="form-select search-select" required>
              <option value="0">-- Select Vehicle --</option>
              {% for v in vehicles %}
              <option value="{{ v.id }}" {% if (selected_vehicle_id or 0) == v.id %}selected{% endif %}>{{ v.vehicle_no }}</option>
              {% endfor %}
            </select>
          </div>

          <div class="col-md-4">
            <label class="form-label">Work Type</label>
            <input type="text" name="work_type" class="form-control" value="{{ request.form.get('work_type') or (rec.work_type if rec else '') }}" placeholder="Oil Change, Top-up, Filter...">
          </div>
          <div class="col-md-8">
            <label class="form-label">Work Title <span class="text-danger">*</span></label>
            <input type="text" name="title" class="form-control" value="{{ request.form.get('title') or (rec.title if rec else '') }}" placeholder="Short description of oil / lubricant work" required>
          </div>
          <div class="col-12">
            <label class="form-label">Remarks</label>
            <textarea name="remarks" class="form-control" rows="2">{{ request.form.get('remarks') or (rec.remarks if rec else '') }}</textarea>
          </div>
        </div>
        <div class="mt-3 d-flex justify-content-end gap-2">
          <a href="{{ url_for('oil_work_order_list') }}" class="btn btn-outline-secondary">Cancel</a>
          <button type="submit" class="btn btn-primary" id="owoSaveBtn" style="background:#5b21b6;border-color:#5b21b6;">Save Work Order</button>
        </div>
      </form>
    </div>
  </div>
</div>
<script>
document.addEventListener('DOMContentLoaded', function() {
  var owoSaveBtn = document.getElementById('owoSaveBtn');
  var owoForm = document.querySelector('form');
  var owoSubmitLocked = false;
  if (owoForm && owoSaveBtn) {
    owoForm.addEventListener('submit', function(e) {
      if (owoSubmitLocked) { e.preventDefault(); return; }
      owoSubmitLocked = true;
      owoSaveBtn.disabled = true;
      owoSaveBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>Saving...';
    });
  }
  var districtSelect = document.getElementById('districtSelect');
  var projectSelect = document.getElementById('projectSelect');
  var vehicleSelect = document.getElementById('vehicleSelect');
  var LOCATION_CASCADE = null;
  try {
    var lcEl = document.getElementById('locationCascadeData');
    if (lcEl && lcEl.textContent) LOCATION_CASCADE = JSON.parse(lcEl.textContent);
  } catch (e) { LOCATION_CASCADE = null; }
  window._cascadeCache = window._cascadeCache || {};
  if (LOCATION_CASCADE && LOCATION_CASCADE.projects_by_district) {
    Object.keys(LOCATION_CASCADE.projects_by_district).forEach(function(dk) {
      window._cascadeCache['proj_d' + dk] = LOCATION_CASCADE.projects_by_district[dk];
    });
  }
  function vehiclesFromColdCacheWorkOrder(pid, did) {
    if (!LOCATION_CASCADE || !LOCATION_CASCADE.vehicles) return null;
    var list = LOCATION_CASCADE.vehicles;
    var out = [];
    var restrictDid = (did && did !== '0' && did !== 0) ? String(did) : '';
    for (var i = 0; i < list.length; i++) {
      var v = list[i];
      if (String(v.project_id) !== String(pid)) continue;
      if (!restrictDid) { out.push(v); continue; }
      if (String(v.district_id == null ? '' : v.district_id) === restrictDid) out.push(v);
    }
    out.sort(function(a, b) { return (a.vehicle_no || '').localeCompare(b.vehicle_no || '', undefined, { numeric: true }); });
    return out;
  }
  function resetSelectWithDefault(sel, placeholder) {
    if (!sel) return;
    if (sel.tomselect) { try { sel.tomselect.destroy(); } catch(e) {} }
    sel.innerHTML = '<option value="0">' + placeholder + '</option>';
  }
  function initSelectSearch(sel) {
    if (!sel) return;
    if (typeof initSearchableDropdowns === 'function') initSearchableDropdowns(sel.parentNode);
  }
  function fillProjectOptions(arr) {
    resetSelectWithDefault(projectSelect, '-- Select Project --');
    (arr || []).forEach(function(p) {
      var o = document.createElement('option');
      o.value = p.id;
      o.textContent = p.name;
      projectSelect.appendChild(o);
    });
    initSelectSearch(projectSelect);
  }
  function fillVehicleOptions(arr) {
    resetSelectWithDefault(vehicleSelect, '-- Select Vehicle --');
    (arr || []).forEach(function(v) {
      var o = document.createElement('option');
      o.value = v.id;
      o.textContent = v.vehicle_no;
      vehicleSelect.appendChild(o);
    });
    initSelectSearch(vehicleSelect);
  }
  if (districtSelect && projectSelect) {
    districtSelect.addEventListener('change', function() {
      var did = this.value || '0';
      fillProjectOptions([]);
      fillVehicleOptions([]);
      if (did !== '0') {
        var cacheKey = 'proj_d' + did;
        if (window._cascadeCache[cacheKey]) {
          fillProjectOptions(window._cascadeCache[cacheKey]);
          return;
        }
        fetch('/get_projects_by_district/' + did).then(function(r) { return r.json(); }).then(function(arr) {
          window._cascadeCache[cacheKey] = arr || [];
          fillProjectOptions(window._cascadeCache[cacheKey]);
        });
      } else {
        initSelectSearch(projectSelect);
        initSelectSearch(vehicleSelect);
      }
    });
  }
  if (projectSelect && vehicleSelect) {
    projectSelect.addEventListener('change', function() {
      var pid = this.value || '0';
      var did = districtSelect ? (districtSelect.value || '0') : '0';
      fillVehicleOptions([]);
      if (pid !== '0') {
        var vSync = vehiclesFromColdCacheWorkOrder(pid, did);
        if (vSync !== null) {
          fillVehicleOptions(vSync);
          return;
        }
        var cacheKey = 'veh_p' + pid + '_d' + did;
        if (window._cascadeCache[cacheKey]) {
          fillVehicleOptions(window._cascadeCache[cacheKey]);
          return;
        }
        var url = '/get_vehicles_by_project_district?project_id=' + encodeURIComponent(pid);
        if (did !== '0') url += '&district_id=' + encodeURIComponent(did);
        fetch(url).then(function(r) { return r.json(); }).then(function(arr) {
          window._cascadeCache[cacheKey] = arr || [];
          fillVehicleOptions(window._cascadeCache[cacheKey]);
        });
      } else {
        initSelectSearch(vehicleSelect);
      }
    });
  }
});
</script>
{% endblock %}
