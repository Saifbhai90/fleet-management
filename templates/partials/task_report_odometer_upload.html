{# Odoo / odometer photo — same 1080×1440 frame + GPS stamp as check-in/check-out (fleetStampAttendancePhoto). #}
<input type="file" id="odomGlobalFileInput" class="d-none" accept="image/jpeg,image/png,image/webp,.jpg,.png,.webp" aria-hidden="true">
<style>
  .te-notice-root { position: fixed; inset: 0; z-index: 1080; display: flex; align-items: flex-end; justify-content: center; padding: 16px 16px max(16px, env(safe-area-inset-bottom, 0px)); }
  .te-notice-root.is-center { align-items: center; }
  .te-notice-root[hidden] { display: none !important; }
  .te-notice-scrim { position: absolute; inset: 0; background: rgba(15, 23, 42, 0.45); }
  .te-notice-card { position: relative; width: min(420px, 100%); background: #fff; border-radius: 18px; padding: 18px 16px 14px; box-shadow: 0 18px 50px rgba(15, 23, 42, 0.22); }
  .te-notice-kicker { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #64748b; margin-bottom: 6px; }
  .te-notice-title { font-size: 1.05rem; font-weight: 800; color: #0f172a; margin: 0 0 6px; }
  .te-notice-body { font-size: 0.9rem; color: #475569; margin: 0 0 14px; line-height: 1.45; }
  .te-notice-actions { display: flex; flex-direction: column; gap: 8px; }
  .te-notice-btn { border: 0; border-radius: 12px; padding: 12px 14px; font-weight: 700; font-size: 0.95rem; }
  .te-notice-btn--primary { background: #0d6efd; color: #fff; }
  .te-notice-btn--ghost { background: #f1f5f9; color: #334155; }
  .te-notice-btn--camera { background: #0f172a; color: #fff; }
  .te-notice-btn--gallery { background: #e8f1ff; color: #0d47a1; }
</style>
<script>
(function() {
  var UP = {{ url_for('api_task_report_odometer_photo_upload') | tojson }};
  var fileInp = document.getElementById('odomGlobalFileInput');
  if (!fileInp) return;

  function isUserCancel(err) {
    var m = String((err && (err.message || err.errorMessage || err.error)) || err || '').toLowerCase();
    return m.indexOf('cancel') !== -1 || m.indexOf('dismiss') !== -1;
  }

  function ensureNoticeRoot() {
    var el = document.getElementById('taskEntryNoticeRoot');
    if (el) return el;
    el = document.createElement('div');
    el.id = 'taskEntryNoticeRoot';
    el.className = 'te-notice-root';
    el.hidden = true;
    el.innerHTML = '<div class="te-notice-scrim" data-notice-dismiss="1"></div><div class="te-notice-card" role="dialog" aria-modal="true"><div class="te-notice-kicker"></div><h3 class="te-notice-title"></h3><p class="te-notice-body"></p><div class="te-notice-actions"></div></div>';
    document.body.appendChild(el);
    el.addEventListener('click', function(ev) {
      if (ev.target.getAttribute('data-notice-dismiss') === '1') hideNotice();
    });
    return el;
  }

  var _noticeResolve = null;
  function hideNotice(result) {
    var el = document.getElementById('taskEntryNoticeRoot');
    if (el) el.hidden = true;
    var fn = _noticeResolve;
    _noticeResolve = null;
    if (fn) fn(result == null ? null : result);
  }

  function showNotice(opts) {
    opts = opts || {};
    return new Promise(function(resolve) {
      var el = ensureNoticeRoot();
      _noticeResolve = resolve;
      el.classList.toggle('is-center', !!opts.center);
      el.querySelector('.te-notice-kicker').textContent = opts.kicker || '';
      el.querySelector('.te-notice-title').textContent = opts.title || '';
      el.querySelector('.te-notice-body').textContent = opts.body || '';
      var actions = el.querySelector('.te-notice-actions');
      actions.innerHTML = '';
      (opts.buttons || [{ id: 'ok', label: 'Theek hai', kind: 'primary' }]).forEach(function(btn) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'te-notice-btn te-notice-btn--' + (btn.kind || 'ghost');
        b.textContent = btn.label;
        b.addEventListener('click', function() { hideNotice(btn.id); });
        actions.appendChild(b);
      });
      el.hidden = false;
    });
  }

  window.taskEntryNotice = function(title, body) {
    return showNotice({
      center: true,
      kicker: 'New Task Entry',
      title: title,
      body: body,
      buttons: [{ id: 'ok', label: 'Theek hai', kind: 'primary' }]
    });
  };

  function pickPhotoSource() {
    return showNotice({
      kicker: 'Odoo meter photo',
      title: 'Photo kaise lagani hai?',
      body: 'Live camera se abhi click karein, ya gallery se pehle se li hui picture chunein.',
      buttons: [
        { id: 'camera', label: 'Live Camera', kind: 'camera' },
        { id: 'gallery', label: 'Gallery', kind: 'gallery' },
        { id: 'cancel', label: 'Cancel', kind: 'ghost' }
      ]
    });
  }

  function csrfHeaders() {
    var f = document.getElementById('batchForm');
    var t = f && f.querySelector('input[name="csrf_token"]');
    var h = { 'Content-Type': 'application/json' };
    if (t && t.value) h['X-CSRFToken'] = t.value;
    return h;
  }

  function rowEditUnlocked(rowId) {
    var m = document.getElementById('row_' + rowId + '_edit_mode');
    return m && m.value === '1';
  }

  function fetchGpsForOdometer(cb) {
    var _isNative = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
    var Geo = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Geolocation;
    if (_isNative && Geo) {
      Geo.getCurrentPosition({ enableHighAccuracy: true, timeout: 12000, maximumAge: 60000 })
        .then(function(p) { cb(p.coords.latitude, p.coords.longitude, p.coords.accuracy); })
        .catch(function() { cb(null, null, null); });
      return;
    }
    if (!_isNative && navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        function(p) { cb(p.coords.latitude, p.coords.longitude, p.coords.accuracy); },
        function() { cb(null, null, null); },
        { enableHighAccuracy: true, timeout: 12000, maximumAge: 60000 }
      );
      return;
    }
    cb(null, null, null);
  }

  function odometerStampOpts(rowId, lat, lng, accuracyMeters) {
    var ctx = (typeof window.fleetGetOdometerStampContext === 'function')
      ? window.fleetGetOdometerStampContext(rowId)
      : {};
    return {
      line1Prefix: 'Odoo meter GPS+Cam',
      lat: lat,
      lng: lng,
      accuracyMeters: accuracyMeters,
      projectName: ctx.projectName,
      districtName: ctx.districtName,
      countryName: ctx.countryName,
      countryCode: ctx.countryCode,
      countryFlag: ctx.countryFlag,
      vehicleNo: ctx.vehicleNo,
      driverName: ctx.driverName || '',
      rearCamera: true,
      useFixedFrame: true,
      maxSide: 2048,
      quality: 0.88
    };
  }

  function stampAndUpload(rowId, dataUrl, lat, lng, accuracyMeters) {
    if (typeof window.fleetStampAttendancePhoto !== 'function') {
      return Promise.reject(new Error('Photo stamp not loaded — refresh the page.'));
    }
    return window.fleetStampAttendancePhoto(dataUrl, null, odometerStampOpts(rowId, lat, lng, accuracyMeters))
      .then(function(res) {
        if (res && res.dataUrl) queueOdometerPending(rowId, res.dataUrl);
        return uploadJpeg(rowId, res.dataUrl);
      });
  }

  function setRowPhotoUi(rowId, url) {
    var row = document.querySelector('.odom-url-input[data-row="' + rowId + '"]');
    if (!row) return;
    row.value = url || '';
    var cell = row.closest('.odometer-cell');
    if (!cell) return;
    var wrap = cell.querySelector('.odom-ctrl-wrap');
    if (!wrap) return;
    var ph = cell.querySelector('.odom-thumb-placeholder');
    var link = cell.querySelector('.odom-thumb-link');
    var clr = cell.querySelector('.odom-clear-btn');
    var btn = cell.querySelector('.odom-photo-btn');
    var inline = btn && btn.querySelector('.odom-inline-thumb');
    if (url) {
      if (ph) ph.classList.add('d-none');
      if (link) {
        link.setAttribute('data-url', url);
        var im0 = link.querySelector('img');
        if (im0) im0.src = url;
        link.classList.remove('d-none');
      } else {
        var thumbBtn = document.createElement('button');
        thumbBtn.type = 'button';
        thumbBtn.className = 'att-photo-fullview-btn p-0 border-0 bg-transparent d-inline-block rounded odom-thumb-link';
        thumbBtn.setAttribute('data-url', url);
        thumbBtn.setAttribute('data-label', 'Odoo meter photo');
        thumbBtn.title = 'Odoo meter — full view';
        var im = document.createElement('img');
        im.src = url;
        im.alt = 'Odoo meter';
        im.className = 'rounded border odom-thumb';
        im.style.cssText = 'max-height:44px;max-width:64px;object-fit:cover;';
        thumbBtn.appendChild(im);
        wrap.insertBefore(thumbBtn, wrap.firstChild);
      }
      if (clr) clr.classList.remove('d-none');
      if (btn && inline) {
        inline.src = url;
        inline.classList.remove('d-none');
        inline.classList.add('border-success');
        btn.classList.add('border-success');
      }
    } else {
      if (ph) ph.classList.remove('d-none');
      if (link) link.remove();
      if (clr) clr.classList.add('d-none');
      if (btn && inline) {
        inline.removeAttribute('src');
        inline.classList.add('d-none');
        inline.classList.remove('border-success');
        btn.classList.remove('border-success');
      }
    }
  }

  function taskDateDmy() {
    var inp = document.querySelector('#batchForm input[name="task_date"]') || document.querySelector('#filterForm input[name="date"]');
    return (inp && inp.value) ? inp.value.trim() : '';
  }

  function vehicleIdForRow(rowId) {
    var tr = document.querySelector('tr.task-row[data-vehicle-id="' + rowId + '"]');
    return tr ? tr.getAttribute('data-vehicle-id') : String(rowId);
  }

  function vehicleNoForRow(rowId) {
    var tr = document.querySelector('tr.task-row[data-vehicle-id="' + rowId + '"]');
    return tr ? (tr.getAttribute('data-vehicle') || '') : '';
  }

  function queueOdometerPending(rowId, jpegDataUrl) {
    if (!window.FleetGpsPendingUpload || !jpegDataUrl) return;
    var vid = vehicleIdForRow(rowId);
    window.FleetGpsPendingUpload.saveOdometerPending(vid, taskDateDmy(), {
      photo_base64: jpegDataUrl,
      vehicle_no: vehicleNoForRow(rowId),
      vehicle_id: vid
    });
    if (window.FleetGpsPendingUpload.refresh) window.FleetGpsPendingUpload.refresh();
  }

  function uploadJpeg(rowId, jpegDataUrl) {
    return fetch(UP, {
      method: 'POST',
      headers: csrfHeaders(),
      body: JSON.stringify({
        photo_base64: jpegDataUrl,
        vehicle_id: vehicleIdForRow(rowId),
        task_date: taskDateDmy()
      })
    }).then(function(r) {
      return r.text().then(function(txt) {
        var body = {};
        try { body = txt ? JSON.parse(txt) : {}; } catch (e) {}
        return { ok: r.ok, body: body };
      });
    }).then(function(res) {
      if (!res.ok || !res.body.ok) {
        queueOdometerPending(rowId, jpegDataUrl);
        throw new Error((res.body && res.body.message) || 'Upload failed — saved on device, auto-retry will continue.');
      }
      if (window.FleetGpsPendingUpload) {
        window.FleetGpsPendingUpload.clearOdometerPending(vehicleIdForRow(rowId), taskDateDmy());
      }
      setRowPhotoUi(rowId, res.body.url);
      if (window.fleetClearResumePath) window.fleetClearResumePath();
    }).catch(function(err) {
      if (jpegDataUrl && (!err.message || err.message.indexOf('auto-retry') < 0)) {
        queueOdometerPending(rowId, jpegDataUrl);
      }
      throw err;
    });
  }

  function processAnyImageSource(rowId, dataUrl, lat, lng, accuracyMeters) {
    return stampAndUpload(rowId, dataUrl, lat, lng, accuracyMeters);
  }

  function setOdomBusy(rowId, busy) {
    var btn = document.querySelector('.odom-photo-btn[data-row="' + rowId + '"]');
    if (!btn) return;
    btn.disabled = !!busy;
    if (busy) btn.setAttribute('aria-busy', 'true');
    else btn.removeAttribute('aria-busy');
  }

  function runWithGps(rowId, dataUrl, fromRear) {
    if (window.fleetSetResumePath) window.fleetSetResumePath({ odomRow: rowId });
    setOdomBusy(rowId, true);
    fetchGpsForOdometer(function(lat, lng, acc) {
      var opts = odometerStampOpts(rowId, lat, lng, acc);
      if (fromRear) opts.rearCamera = true;
      if (typeof window.fleetStampAttendancePhoto !== 'function') {
        setOdomBusy(rowId, false);
        window.taskEntryNotice('Photo lag nahi saki', 'Page refresh karke dubara Attach dabaen.');
        return;
      }
      window.fleetStampAttendancePhoto(dataUrl, null, opts)
        .then(function(res) { return uploadJpeg(rowId, res.dataUrl); })
        .catch(function(err) {
          if (isUserCancel(err)) return;
          window.taskEntryNotice('Photo upload nahi hui', err.message || String(err));
        })
        .finally(function() {
        setOdomBusy(rowId, false);
        if (window.fleetClearResumePath) window.fleetClearResumePath();
      });
    });
  }

  var pendingRowId = null;

  function openFilePickerForRow(rowId, fromCamera) {
    if (window.fleetSetResumePath) window.fleetSetResumePath({ odomRow: rowId });
    pendingRowId = rowId;
    fileInp.value = '';
    if (fromCamera) fileInp.setAttribute('capture', 'environment');
    else fileInp.removeAttribute('capture');
    fileInp.click();
  }

  fileInp.addEventListener('change', function() {
    var rowId = pendingRowId;
    pendingRowId = null;
    if (!rowId || !fileInp.files || !fileInp.files[0]) return;
    var reader = new FileReader();
    reader.onload = function() {
      runWithGps(rowId, reader.result, false);
    };
    reader.readAsDataURL(fileInp.files[0]);
  });

  function nativeGetPhoto(rowId, source) {
    if (window.fleetSetResumePath) window.fleetSetResumePath({ odomRow: rowId });
    var Cam = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Camera;
    if (!Cam || !Cam.getPhoto) {
      openFilePickerForRow(rowId, source === 'CAMERA');
      return;
    }
    setOdomBusy(rowId, true);
    fetchGpsForOdometer(function(lat, lng, acc) {
      Cam.getPhoto({
        quality: 90,
        allowEditing: false,
        resultType: 'base64',
        source: source,
        direction: 'REAR',
        saveToGallery: false
      }).then(function(photo) {
        var raw = 'data:image/jpeg;base64,' + (photo.base64String || '');
        return stampAndUpload(rowId, raw, lat, lng, acc);
      }).catch(function(err) {
        if (isUserCancel(err)) {
          window.taskEntryNotice('Photo nahi lagi', 'Camera ya gallery band kar di — koi masla nahi. Attach dubara daba kar live camera ya gallery se laga sakte ho.');
          return;
        }
        window.taskEntryNotice('Camera open nahi hua', (err && err.message) ? err.message : 'Dubara try karein.');
      }).finally(function() {
        setOdomBusy(rowId, false);
        if (window.fleetClearResumePath) window.fleetClearResumePath();
      });
    });
  }

  function nativeRearCamera(rowId) {
    nativeGetPhoto(rowId, 'CAMERA');
  }

  document.addEventListener('click', function(e) {
    var clr = e.target.closest('.odom-clear-btn');
    if (clr) {
      e.preventDefault();
      var rid = clr.getAttribute('data-row');
      if (!rid || !rowEditUnlocked(rid)) return;
      setRowPhotoUi(rid, '');
      return;
    }
    var btn = e.target.closest('.odom-photo-btn');
    if (!btn) return;
    e.preventDefault();
    var rowId = btn.getAttribute('data-row');
    if (!rowId || !rowEditUnlocked(rowId)) return;
    var isNative = !!(window.FleetBridge && window.FleetBridge.isNative);
    pickPhotoSource().then(function(choice) {
      if (!choice || choice === 'cancel') return;
      if (isNative) nativeGetPhoto(rowId, choice === 'gallery' ? 'PHOTOS' : 'CAMERA');
      else openFilePickerForRow(rowId, choice === 'camera');
    });
  });

  var batchForm = document.getElementById('batchForm');
  if (batchForm) {
    batchForm.addEventListener('paste', function(e) {
      var wrap = e.target.closest('.odom-ctrl-wrap');
      if (!wrap) return;
      var rowId = wrap.getAttribute('data-row');
      if (!rowId || !rowEditUnlocked(rowId) || wrap.classList.contains('odom-wrap-locked')) return;
      var cd = e.clipboardData;
      if (!cd || !cd.items) return;
      for (var i = 0; i < cd.items.length; i++) {
        if (cd.items[i].type.indexOf('image') === -1) continue;
        e.preventDefault();
        var blob = cd.items[i].getAsFile();
        if (!blob) continue;
        var r = new FileReader();
        r.onload = function() { runWithGps(rowId, r.result, false); };
        r.readAsDataURL(blob);
        break;
      }
    });
  }
  document.addEventListener('fleet-odometer-uploaded', function(e) {
    var d = e.detail || {};
    if (!d.vehicleId || !d.url) return;
    var row = document.querySelector('tr.task-row[data-vehicle-id="' + d.vehicleId + '"]');
    if (!row) return;
    var inp = row.querySelector('.odom-url-input');
    if (inp) setRowPhotoUi(inp.getAttribute('data-row'), d.url);
  });

  window.taskEntrySetRowPhotoUi = setRowPhotoUi;
})();
</script>
