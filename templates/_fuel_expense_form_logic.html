    }

      window._cascadeCache['proj_d' + dk] = FUEL_CASCADE.projects_by_district[dk];

    if (!FUEL_CASCADE || !FUEL_CASCADE.projects_by_district) return null;
    return FUEL_CASCADE.projects_by_district[String(did)] || [];
  }
  function vehiclesFromColdCache(pid, did) {
    if (!FUEL_CASCADE || !FUEL_CASCADE.vehicles) return null;
    var list = FUEL_CASCADE.vehicles;
    var out = [];
    var restrictDid = (did && did !== '0' && did !== 0) ? String(did) : '';
    for (var i = 0; i < list.length; i++) {
      var v = list[i];
      if (String(v.project_id) !== String(pid)) continue;
      if (!restrictDid) {
        out.push(v);
        continue;
      }
      if (String(v.district_id == null ? '' : v.district_id) === restrictDid) out.push(v);
    }
    out.sort(function(a, b) {
      return (a.vehicle_no || '').localeCompare(b.vehicle_no || '', undefined, { numeric: true });
    });
    return out;
  }

  function setFuelTypeAuto(fuelType) {
    var ft = (fuelType || '').trim();
    if (fuelTypeSelect) fuelTypeSelect.value = ft;
    if (!fuelTypeDisplay) return;
    if (fuelTypeDisplay.tagName === 'INPUT' || fuelTypeDisplay.tagName === 'SELECT' || fuelTypeDisplay.tagName === 'TEXTAREA') {
      fuelTypeDisplay.value = ft;
      return;
    }
    fuelTypeDisplay.textContent = ft || 'Auto';
    fuelTypeDisplay.classList.toggle('is-empty', !ft);
  }
  if (fuelTypeSelect && fuelTypeSelect.value) {
    setFuelTypeAuto(fuelTypeSelect.value);
  }
  if (expenseBySelect && expenseBySelect.options) {
    for (var e = 0; e < expenseBySelect.options.length; e += 1) {
      var opt = expenseBySelect.options[e];
      if ((opt.textContent || '').toLowerCase().indexOf('1110 - hbl bank') === 0) {
        cashExpenseByValue = opt.value;
        break;
      }
    }
  }
  function parseNum(val) {
    if (val === '' || val === null || val === undefined) return null;
    var n = parseFloat(String(val).replace(/,/g, ''));
    return isNaN(n) ? null : n;
  }
  function escHtml(val) {
    return String(val == null ? '' : val)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function setTaskKmField(el, val) {
    if (!el) return;
    var text = (val === null || val === undefined || val === '') ? '' : String(val);
    if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.tagName === 'SELECT') {
      el.value = text;
      return;
    }
    el.textContent = text || '—';
  }

  function fetchSuggestedPrice() {
    var ft = fuelTypeSelect && fuelTypeSelect.value;
    var fDate = fuelingDateInput && fuelingDateInput.value;
    var pumpId = fuelPumpSelect && fuelPumpSelect.value;
    var recId = fuelExpenseForm ? (fuelExpenseForm.getAttribute('data-record-id') || '') : '';
    if (fuelPriceInput) fuelPriceInput.setAttribute('placeholder', '0');
    if (!ft || (ft !== 'Diesel' && ft !== 'Super' && ft !== 'Petrol')) return;
    var url = '/api/fuel-expense/suggested-price?fuel_type=' + encodeURIComponent(ft);
    if (fDate) url += '&fueling_date=' + encodeURIComponent(fDate);
    if (pumpId && pumpId !== '0') url += '&fuel_pump_id=' + encodeURIComponent(pumpId);
    if (recId) url += '&exclude_id=' + encodeURIComponent(recId);
    fetch(url)
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (!fuelPriceInput) return;
        if (!data || data.fuel_price == null) {
          _lastSuggestedBenchmark = null;
          checkFuelPriceTolerance();
          if (fuelPriceInput.dataset.autoSuggested === '1') {
            fuelPriceInput.value = '';
            fuelPriceInput.dataset.autoSuggested = '0';
            computeMpgAndLiters();
          }
          return;
        }
        var suggested = parseFloat(data.fuel_price);
        if (!isFinite(suggested) || suggested <= 0) return;
        _lastSuggestedBenchmark = suggested;
        fuelPriceInput.setAttribute('placeholder', 'Suggested: ' + suggested.toFixed(2));
        var entered = parseNum(fuelPriceInput.value);
        if (entered == null || entered <= 0 || fuelPriceInput.dataset.autoSuggested === '1') {
          fuelPriceInput.value = suggested.toFixed(2);
          fuelPriceInput.dataset.autoSuggested = '1';
          computeMpgAndLiters();
        }
        checkFuelPriceTolerance();
      })
      .catch(function() {});
  }

  function setMetricCard(cardEl, valueEl, value, state) {
    if (valueEl) valueEl.textContent = (value === null || value === undefined || value === '') ? '—' : String(value);
    if (!cardEl) return;
    cardEl.classList.remove('is-ok', 'is-bad', 'is-neutral');
    cardEl.classList.add(state || 'is-neutral');
  }

  function parseMetricText(el) {
    if (!el) return null;
    var raw = (el.textContent || '').replace(/,/g, '').trim();
    if (!raw || raw === '—') return null;
    return parseNum(raw);
  }

  function refreshMeterInfoStrip() {
    if (!meterInfoStrip) return;
    var hasPso = psoRateDatePanel && psoRateDatePanel.style.display !== 'none';
    var hasMpg = monthMpgNote && !monthMpgNote.classList.contains('d-none');
    meterInfoStrip.classList.toggle('d-none', !hasPso && !hasMpg);
  }

  function compactPsoRateLabel(label) {
    var text = label || 'PSO Rate';
    if (!isFuelMobilePreviewPage()) return text;
    return /diesel/i.test(text) ? 'PSO Diesel' : 'PSO';
  }

  function setPsoRateTileLoading(label) {

    psoRateDatePanel.classList.add('is-loading');

    if (html) {
      el.innerHTML = html;
      el.classList.remove('d-none');
      return true;

  function updateMeterAlertsPanel() {
    var any = false;
    any = setMeterAlert(alertOdometerGap, getKmGapAlertHtml()) || any;
    any = setMeterAlert(alertRangeAlignment, getRangeAlignmentAlertHtml()) || any;
    any = setMeterAlert(alertVolumeCapacity, getVolumeCapacityAlertHtml()) || any;
    any = setMeterAlert(alertPriceBenchmark, getPriceBenchmarkAlertHtml()) || any;
    if (meterAlertsPanel) meterAlertsPanel.classList.toggle('d-none', !any);

  function getActivePriceBenchmark() {
    if (_lastPsoBenchmark != null && isFinite(_lastPsoBenchmark) && _lastPsoBenchmark > 0) {
      return _lastPsoBenchmark;
    }
    if (_lastSuggestedBenchmark != null && isFinite(_lastSuggestedBenchmark) && _lastSuggestedBenchmark > 0) {
      return _lastSuggestedBenchmark;
    }
    return null;
  }

  function checkFuelPriceTolerance() {
    if (!fuelPriceInput) return;
    var tolerance = parseFloat(FUEL_SETTINGS.price_tolerance_rs);
    if (!isFinite(tolerance) || tolerance <= 0) {
      fuelPriceInput.classList.remove('field-invalid');
      updateMeterAlertsPanel();
      return;
    }
    var benchmark = getActivePriceBenchmark();
    if (benchmark == null) {
      fuelPriceInput.classList.remove('field-invalid');
      updateMeterAlertsPanel();
      return;
    }
    var entered = parseNum(fuelPriceInput.value);
    if (entered == null || entered <= 0) {
      fuelPriceInput.classList.remove('field-invalid');
      updateMeterAlertsPanel();
      return;
    }
    var diff = Math.abs(entered - benchmark);
    if (diff > tolerance) {
      fuelPriceInput.classList.add('field-invalid');
    } else {
      fuelPriceInput.classList.remove('field-invalid');
    }
    updateMeterAlertsPanel();
  }

  function getPriceBenchmarkAlertHtml() {
    if (!fuelPriceInput) return '';
    var tolerance = parseFloat(FUEL_SETTINGS.price_tolerance_rs);
    if (!isFinite(tolerance) || tolerance <= 0) return '';
    var benchmark = getActivePriceBenchmark();
    if (benchmark == null) return '';
    var entered = parseNum(fuelPriceInput.value);
    if (entered == null || entered <= 0) return '';
    var diff = Math.abs(entered - benchmark);
    if (diff <= tolerance) return '';
    return '<strong>Price Benchmark:</strong> Price Rs ' + entered.toFixed(2) +
      ' is Rs ' + diff.toFixed(2) + ' away from benchmark Rs ' + benchmark.toFixed(2) +
      ' (max ± Rs ' + tolerance.toFixed(2) + ' allowed).';
  }

  function resolveKmGapMaxClient() {
    var defaultMax = parseInt(FUEL_SETTINGS.km_gap_default_max_km, 10);
    if (!isFinite(defaultMax) || defaultMax <= 0) defaultMax = 500;
    var districtId = districtSelect && districtSelect.value && districtSelect.value !== '0' ? parseInt(districtSelect.value, 10) : null;
    var projectId = projectSelect && projectSelect.value && projectSelect.value !== '0' ? parseInt(projectSelect.value, 10) : null;
    var vehicleFamily = '';
    if (vehicleSelect && vehicleSelect.value && vehicleSelect.value !== '0') {
      vehicleFamily = (_vehicleFamilyMap[String(vehicleSelect.value)] || '').toLowerCase();
    }
    var rules = FUEL_SETTINGS.km_gap_rules || [];
    var best = null;
    var bestScore = -1;
    rules.forEach(function(rule) {
      var score = 0;
      var rid = rule.district_id != null ? parseInt(rule.district_id, 10) : null;
      var rpid = rule.project_id != null ? parseInt(rule.project_id, 10) : null;
      var rfam = (rule.vehicle_family || '').toLowerCase();
      if (rid && rid !== districtId) return;
      if (rid) score += 1;
      if (rpid && rpid !== projectId) return;
      if (rpid) score += 4;
      if (rfam && rfam !== vehicleFamily) return;
      if (rfam) score += 2;
      if (score > bestScore) {
        bestScore = score;
        best = rule;
      }
    });
    if (best && best.max_km) return parseInt(best.max_km, 10);
    return defaultMax;
  }

  function getKmGapAlertHtml() {
    var prev = parseNum(previousReadingInput ? previousReadingInput.value : null);
    var curr = parseNum(currentReadingInput ? currentReadingInput.value : null);
    if (prev == null || curr == null || curr <= prev) return '';
    var gap = curr - prev;
    var maxKm = resolveKmGapMaxClient();
    if (!isFinite(maxKm) || maxKm <= 0 || gap <= maxKm) return '';
    return '<strong>Odometer Gap:</strong> ' + gap.toLocaleString(undefined, { maximumFractionDigits: 0 }) +
      ' KM running delta vs max ' + maxKm.toLocaleString(undefined, { maximumFractionDigits: 0 }) +
      ' KM configured threshold. Was a middle fueling slip missed?';
  }

  function getRangeAlignmentAlertHtml() {
    var curr = parseNum(currentReadingInput ? currentReadingInput.value : null);
    if (curr == null || taskStartReading == null || taskCloseReading == null) return '';
    var low = Math.min(taskStartReading, taskCloseReading);
    var high = Math.max(taskStartReading, taskCloseReading);
    if (curr >= low && curr <= high) return '';
    var diff = curr < low ? (low - curr) : (curr - high);
    return '<strong>Range Alignment:</strong> Task KM Out: ' + taskStartReading +
      ', KM In: ' + taskCloseReading + '. Your entry reading is outside range by ' +
      diff.toLocaleString(undefined, { maximumFractionDigits: 0 }) + ' KM.';
  }

  function getVolumeCapacityAlertHtml() {
    var cap = getSelectedVehicleTankCapacity();
    var liters = parseNum(litersInput ? litersInput.value : null);
    if (cap <= 0 || liters == null || liters <= cap) return '';
    return '<strong>Volume Capacity:</strong> Calculated Liters (' + liters.toFixed(2) +
      'L) exceed this vehicle profile\'s maximum physical tank capacity (' + cap.toFixed(0) + 'L).';
  }

  function getKmGapWarningText() {
    var html = getKmGapAlertHtml();
    if (!html) return '';
    return html.replace(/<\/?strong>/gi, '');
  }

      return;

    var label = km.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    setMetricCard(kmMetricCard, kmDisplay, label, hasGap ? 'is-bad' : 'is-ok');
  }

  function updateKmGapWarning() {
    updateKmMetricCard();
    updateMeterAlertsPanel();

    return vehicleSelect.value || '';

  function _fmtEntryNum(val, digits) {
    if (val == null || val === '') return '—';
    var n = parseFloat(val);
    if (isNaN(n)) return '—';
    return n.toLocaleString(undefined, { maximumFractionDigits: digits != null ? digits : 2 });
  }

  function formatVehicleLastEntryStrip(entry) {
    var parts = ['<strong>Last Entry:</strong>'];
    parts.push('<span>' + escHtml(entry.fueling_date || '—') + '</span>');
    parts.push('<span class="text-muted">|</span>');
    parts.push('<span>' + (entry.current_reading != null ? _fmtEntryNum(entry.current_reading, 0) : '—') + '</span>');
    parts.push('<span class="text-muted">|</span>');
    parts.push('<strong>Rs ' + (entry.amount != null ? _fmtEntryNum(entry.amount, 0) : '—') + '</strong>');
    if (entry.liters != null) {
      parts.push('<span class="text-muted">|</span>');
      parts.push('<span>' + parseFloat(entry.liters).toFixed(2) + ' L</span>');
    }
    if (entry.fuel_price != null) {
      parts.push('<span class="text-muted">|</span>');
      parts.push('<span>@ Rs ' + parseFloat(entry.fuel_price).toFixed(2) + '</span>');
    }
    return parts.join(' ');
  }

    html += item('Vehicle', entry.vehicle_no);
    html += item('District', entry.district);
    html += item('Project', entry.project);
    html += item('Pump', entry.pump_name);
    html += item('Fuel Type', entry.fuel_type);
    html += item('Payment', entry.payment_type);
    html += item('Slip No', entry.slip_no);
    html += item('Card Swipe', entry.card_swipe_date);
    html += item('Prev Reading', entry.previous_reading != null ? _fmtEntryNum(entry.previous_reading, 0) : '—');
    html += item('Current Reading', entry.current_reading != null ? _fmtEntryNum(entry.current_reading, 0) : '—');
    html += item('KM', entry.km != null ? _fmtEntryNum(entry.km, 2) : '—');
    html += item('KM Out (Task)', entry.km_out_task != null ? _fmtEntryNum(entry.km_out_task, 2) : '—');
    html += item('KM In (Task)', entry.km_in_task != null ? _fmtEntryNum(entry.km_in_task, 2) : '—');
    html += item('Matched', entry.meter_reading_matched);
    html += item('MPG', entry.mpg != null ? _fmtEntryNum(entry.mpg, 2) : '—');
    html += item('Liters', entry.liters != null ? _fmtEntryNum(entry.liters, 2) + ' L' : '—');
    html += item('Price/Ltr', entry.fuel_price != null ? 'Rs ' + _fmtEntryNum(entry.fuel_price, 2) : '—');
    html += item('Upload', (entry.upload_status || '—').toUpperCase());
    html += '</div>';
    html += '<div class="fuel-entry-detail-total"><div class="lbl">Amount</div><div class="val">Rs ' +
      (entry.amount != null ? _fmtEntryNum(entry.amount, 0) : '—') + '</div></div>';

  function fetchLastReading() {
    var vid = vehicleSelect && vehicleSelect.value;
    var fDate = fuelingDateInput && fuelingDateInput.value;
    var currReadingVal = currentReadingInput && currentReadingInput.value ? currentReadingInput.value : '';
    var recId = fuelExpenseForm ? (fuelExpenseForm.getAttribute('data-record-id') || '') : '';
    if (!vid || vid === '0') {
      if (previousReadingInput) previousReadingInput.value = '';
      setFuelTypeAuto('');
      computeKm();
      return;
    }
    var url = '/api/fuel-expense/last-reading?vehicle_id=' + encodeURIComponent(vid);
    if (fDate) url += '&fueling_date=' + encodeURIComponent(fDate);
    if (recId) url += '&exclude_id=' + encodeURIComponent(recId);
    if (currReadingVal) url += '&current_reading=' + encodeURIComponent(currReadingVal);
    fetch(url)
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (data.previous_reading != null && previousReadingInput) {
          previousReadingInput.value = data.previous_reading;
        }
        if (data.fuel_type) {
          setFuelTypeAuto(data.fuel_type);
        } else if (fuelTypeSelect && fuelTypeSelect.value) {
          setFuelTypeAuto(fuelTypeSelect.value);
        }
        fetchSuggestedPrice();
        fetchPriceHistory();
        fetchPsoRateForDate();
        computeKm();
        fetchMonthMpg();
        updateOdometerGauge();
      }).catch(function() { /* offline — keep current values */ });
  }

  function fetchTaskReadings() {
    var vid = vehicleSelect && vehicleSelect.value;
    var d = fuelingDateInput && fuelingDateInput.value;
    if (!vid || vid === '0' || !d) {
      setTaskKmField(kmOutTask, '');
      setTaskKmField(kmInTask, '');
      taskStartReading = null;
      taskCloseReading = null;
      updateMatchedState();
      updateOdometerGauge();
      return;
    }
    fetch('/api/fuel-expense/task-readings?vehicle_id=' + vid + '&fueling_date=' + encodeURIComponent(d))
      .then(function(r) { return r.json(); })
      .then(function(data) {
        setTaskKmField(kmOutTask, data.km_out_task != null ? data.km_out_task : '');
        setTaskKmField(kmInTask, data.km_in_task != null ? data.km_in_task : '');
        taskStartReading = parseNum(data.km_out_task);
        taskCloseReading = parseNum(data.km_in_task);
        computeKm();
        updateOdometerGauge();
      }).catch(function() { /* offline — keep last known task readings */ });
  }

  function updateMatchedState() {
        var curr = parseNum(currentReadingInput.value);
        if (curr == null || taskStartReading == null || taskCloseReading == null) {
      setMetricCard(matchedMetricCard, meterMatched, '—', 'is-neutral');
      updateMeterAlertsPanel();
          return;
        }
        var low = Math.min(taskStartReading, taskCloseReading);
        var high = Math.max(taskStartReading, taskCloseReading);
        var matched = curr >= low && curr <= high;
    setMetricCard(matchedMetricCard, meterMatched, matched ? 'Yes' : 'No', matched ? 'is-ok' : 'is-bad');
    if (matched) closeMeterMatchWarning();
    updateMeterAlertsPanel();
  }

  function computeKm() {
    var prev = parseNum(previousReadingInput ? previousReadingInput.value : null);
    var curr = parseNum(currentReadingInput ? currentReadingInput.value : null);
    var baseReading = prev != null ? prev : taskStartReading;
    if (baseReading != null && curr != null) {
      if (kmDisplay) kmDisplay.textContent = (curr - baseReading).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    } else if (kmDisplay) {
      kmDisplay.textContent = '—';
    }
    updateMatchedState();
    updateOdometerGauge();
    updateKmGapWarning();
    computeMpgAndLiters();
  }

  function getSelectedVehicleTankCapacity() {
    if (!vehicleSelect || !vehicleSelect.value || vehicleSelect.value === '0') return 0;
    return parseFloat(_vehicleTankCapacityMap[String(vehicleSelect.value)] || 0) || 0;
  }

  function getTankCapacityWarningText() {
    var cap = getSelectedVehicleTankCapacity();
    var liters = parseNum(litersInput ? litersInput.value : null);
    if (cap <= 0 || liters == null || liters <= cap) return '';
    return 'Calculated Liters (' + liters.toFixed(0) + 'L) exceed vehicle\'s max tank capacity (' + cap.toFixed(0) + 'L).';
  }

  function updateMpgMetricCard(km, lit) {
    if (km != null && lit != null && lit > 0) {
      var mpg = km / lit;
      var label = mpg.toFixed(2);
      setMetricCard(mpgMetricCard, mpgDisplay, label, mpg > 0 ? 'is-ok' : 'is-bad');
      return;
    }
    setMetricCard(mpgMetricCard, mpgDisplay, '—', 'is-neutral');
  }

  function updateTankCapacityWarning() {
    var msg = getTankCapacityWarningText();
    if (!msg) {
      if (litersInput) litersInput.classList.remove('field-invalid');
    } else if (litersInput) {
      litersInput.classList.add('field-invalid');
    }
    updateMeterAlertsPanel();
  }

  function updateOdometerGauge() {
    if (!odometerGaugeWrap) return;
    var prev = parseNum(previousReadingInput ? previousReadingInput.value : null);
    var curr = parseNum(currentReadingInput ? currentReadingInput.value : null);
    var taskIn = taskCloseReading;
    var taskOut = taskStartReading;
    if (taskIn == null) {
      odometerGaugeWrap.classList.add('d-none');
      return;
    }
    odometerGaugeWrap.classList.remove('d-none');
    var trackMin = prev != null ? Math.min(prev, taskIn) : (taskOut != null ? Math.min(taskOut, taskIn) : taskIn - 50);
    var trackMax = prev != null ? Math.max(prev, taskIn) : (taskOut != null ? Math.max(taskOut, taskIn) : taskIn + 50);
    if (taskOut != null) {
      trackMin = Math.min(trackMin, taskOut, taskIn);
      trackMax = Math.max(trackMax, taskOut, taskIn);
    }
    if (curr != null) {
      trackMin = Math.min(trackMin, curr);
      trackMax = Math.max(trackMax, curr);
    }
    if (trackMax <= trackMin) trackMax = trackMin + 1;
    if (gaugePrevLabel) gaugePrevLabel.textContent = prev != null ? prev.toLocaleString(undefined, { maximumFractionDigits: 0 }) : '—';
    if (gaugeTaskInLabel) gaugeTaskInLabel.textContent = taskIn.toLocaleString(undefined, { maximumFractionDigits: 0 });
    if (gaugeTaskOutLabel) {
      if (taskOut != null) {
        gaugeTaskOutLabel.classList.remove('d-none');
        gaugeTaskOutLabel.innerHTML = 'Out: <strong>' + taskOut.toLocaleString(undefined, { maximumFractionDigits: 0 }) + '</strong>';
      } else {
        gaugeTaskOutLabel.classList.add('d-none');
      }
    }
    function pctFor(val) {
      return Math.max(0, Math.min(100, ((val - trackMin) / (trackMax - trackMin)) * 100));
    }
    if (gaugeTaskZone && taskOut != null) {
      var zoneLow = Math.min(taskOut, taskIn);
      var zoneHigh = Math.max(taskOut, taskIn);
      gaugeTaskZone.classList.remove('d-none');
      gaugeTaskZone.style.left = pctFor(zoneLow) + '%';
      gaugeTaskZone.style.width = Math.max(0, pctFor(zoneHigh) - pctFor(zoneLow)) + '%';
    } else if (gaugeTaskZone) {
      gaugeTaskZone.classList.add('d-none');
    }
    if (gaugeTaskOutTick && taskOut != null) {
      gaugeTaskOutTick.classList.remove('d-none');
      gaugeTaskOutTick.style.left = pctFor(taskOut) + '%';
    } else if (gaugeTaskOutTick) {
      gaugeTaskOutTick.classList.add('d-none');
    }
    if (gaugeCurrentMarker) {
      if (curr != null) {
        gaugeCurrentMarker.classList.remove('d-none');
        gaugeCurrentMarker.style.left = pctFor(curr) + '%';
        var rangeLow = taskOut != null ? Math.min(taskOut, taskIn) : Math.min(prev != null ? prev : taskIn, taskIn);
        var rangeHigh = taskOut != null ? Math.max(taskOut, taskIn) : Math.max(prev != null ? prev : taskIn, taskIn);
        var inTaskRange = curr >= rangeLow && curr <= rangeHigh;
        gaugeCurrentMarker.classList.toggle('in-range', inTaskRange);
        gaugeCurrentMarker.classList.toggle('out-range', !inTaskRange);
        if (gaugeStatusText) {
          var currLabel = curr.toLocaleString(undefined, { maximumFractionDigits: 0 });
          if (inTaskRange) {
            gaugeStatusText.className = 'odometer-gauge-status is-ok';
            gaugeStatusText.textContent = 'Reading ' + currLabel + ' is inside task range.';
          } else {
            var diff = curr < rangeLow ? (rangeLow - curr) : (curr - rangeHigh);
            gaugeStatusText.className = 'odometer-gauge-status is-bad';
            gaugeStatusText.textContent = 'Reading ' + currLabel + ' is outside task range by ' + diff.toFixed(0) + ' KM.';
          }
        }
      } else {
        gaugeCurrentMarker.classList.add('d-none');
        if (gaugeStatusText) {
          gaugeStatusText.className = 'odometer-gauge-status is-muted';
          gaugeStatusText.textContent = 'Type current reading to update gauge.';
        }
      }
    }
  }

  function fetchPsoRateForDate() {
    if (!psoRateDatePanel) return;
    var ft = (fuelTypeSelect && fuelTypeSelect.value) || '';
    var dateVal = (fuelingDateInput && fuelingDateInput.value) || '';
    if (!ft || (ft !== 'Diesel' && ft !== 'Super' && ft !== 'Petrol') || !dateVal) {
      psoRateDatePanel.style.display = 'none';
      _lastPsoBenchmark = null;
      checkFuelPriceTolerance();
      refreshMeterInfoStrip();
      return;
    }
    var label = (ft === 'Diesel') ? 'PSO Diesel Rate' : 'PSO Petrol Rate';
    setPsoRateTileLoading(label);
    fetch('/api/fuel-market-rate-for-date?date=' + encodeURIComponent(dateVal))
      .then(function(r) { return r.json(); })
      .then(function(data) {
        var key = (ft === 'Diesel') ? 'diesel' : 'petrol';
        var rateLabel = (ft === 'Diesel') ? 'PSO Diesel Rate' : 'PSO Petrol Rate';
        if (!data || !data.ok) {
          var noDate = data && data.no_record_date ? data.no_record_date : dateVal;
          _lastPsoBenchmark = null;
          checkFuelPriceTolerance();
          renderPsoRateTile(
            rateLabel,
            'No Record',
            '<strong>Date:</strong> ' + noDate,
            true
          );
          return;
        }
        var rate = data[key];
        if (rate == null) {
          _lastPsoBenchmark = null;
          checkFuelPriceTolerance();
          renderPsoRateTile(
            rateLabel,
            'No Record',
            '<strong>Date:</strong> ' + dateVal,
            true
          );
        } else {
          var parsedRate = parseFloat(rate);
          _lastPsoBenchmark = (isFinite(parsedRate) && parsedRate > 0) ? parsedRate : null;
          checkFuelPriceTolerance();
          var scanAt = data.scanned_at || data.scan_date || '—';
          renderPsoRateTile(
            rateLabel,
            'Rs ' + parsedRate.toFixed(2) + '<span class="meter-info-tile__unit">/ Ltr</span>',
            '<strong>Last Scan:</strong> ' + scanAt,
            false
          );
        }
      })
      .catch(function() {
        psoRateDatePanel.style.display = 'none';
        _lastPsoBenchmark = null;
        checkFuelPriceTolerance();
        refreshMeterInfoStrip();
      });
  }

  function renderFuelMarketStatus(data) {
    if (!fuelMarketScanStatusBar) return;
    if (!data || !data.sources) {
      fuelMarketScanStatusBar.innerHTML = '<strong>Last Scan:</strong> <span class="text-muted">Not available</span>';
      return;
    }
    var pso = data.sources.pso || {};
    var parts = ['<strong>Last Scan:</strong> ' + (data.scanned_at || '-')];
    if (pso.ok) {
      parts.push('PSO: <span class="scan-ok">OK</span>');
      if (pso.petrol != null) parts.push('Petrol: Rs ' + parseFloat(pso.petrol).toFixed(2));
      if (pso.diesel != null) parts.push('Diesel: Rs ' + parseFloat(pso.diesel).toFixed(2));
    } else {
      parts.push('PSO: <span class="scan-bad">' + (pso.error || 'Scan failed') + '</span>');
    }
    fuelMarketScanStatusBar.innerHTML = parts.join(' | ');
  }

  function fetchFuelMarketScan() {
    fetch('/api/fuel-market-rates')
      .then(function(r) { return r.json(); })
      .then(function(data) { renderFuelMarketStatus(data); })
      .catch(function() { renderFuelMarketStatus(null); });
  }

  function runFuelPsoScanNow() {
    var btn = document.getElementById('fuelPsoScanNowBtn');
    var originalLabel = btn ? (btn.textContent || 'Scan').trim() : 'Scan Now';
    if (btn) {
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>Scanning...';
    }
    var headers = { 'Content-Type': 'application/json', 'Accept': 'application/json' };
    var csrfMeta = document.querySelector('meta[name="csrf-token"]');
    if (csrfMeta && csrfMeta.getAttribute('content')) {
      headers['X-CSRFToken'] = csrfMeta.getAttribute('content');
    }
    fetch('/api/fuel-market-scan-now', { method: 'POST', headers: headers, credentials: 'same-origin', body: '{}' })
      .then(function(r) { return r.json().then(function(d) { return { okHttp: r.ok, data: d }; }); })
      .then(function(res) {
        var data = res.data || {};
        if (!res.okHttp || data.ok === false) {
          throw new Error(data.error || 'Scan failed');
        }
        renderFuelMarketStatus(data);
        try { fetchPsoRateForDate(); } catch (e) {}
      })
      .catch(function(err) {
        if (fuelMarketScanStatusBar) {
          fuelMarketScanStatusBar.innerHTML =
            '<strong>Last Scan:</strong> <span class="scan-bad">' +
            (err && err.message ? err.message : 'Scan failed') +
            '</span>';
        }
      })
      .finally(function() {
        if (btn) {
          btn.disabled = false;
          btn.textContent = originalLabel || 'Scan';
        }
      });
  }

  function setExpenseByValueQuiet(value) {
    if (!expenseBySelect) return;
    var next = value == null ? '' : String(value);
    expenseBySelect.value = next;
    if (typeof fleetSetSelectValue === 'function') {
      fleetSetSelectValue(expenseBySelect, next, true);
      return;
    }
    var ts = expenseBySelect.tomselect;
    if (!ts) return;
    ts._wsSilentFill = true;
    ts._suppressOpen = true;
    try {
      if (next) ts.setValue(next, true);
      else ts.clear(true);
      if (ts.isOpen) ts.close();
    } finally {
      window.setTimeout(function() {
        if (ts.isOpen) ts.close();
        ts._wsSilentFill = false;
        ts._suppressOpen = false;
      }, 80);
    }
  }

  function handlePaymentTypeBehavior(forceReset) {
    if (!paymentTypeSelect) return;
    var paymentType = paymentTypeSelect.value || '';
    var cardEnabled = paymentType === 'Tp/Card' || paymentType === 'Shl/Card';
    var cardDisabled = !cardEnabled;
    if (cardSwipeDateInput) {
      cardSwipeDateInput.disabled = cardDisabled;
      if (cardDisabled) {
        cardSwipeDateInput.value = '';
      }
    }
    if (!expenseBySelect) return;
    var shouldForce = !!forceReset;
    var scrollY = window.pageYOffset || document.documentElement.scrollTop || 0;
    // Quiet value sync only — never focus/open Expense By from Payment Type.
    if (paymentType === 'Cash') {
      if (cashExpenseByValue && (shouldForce || !expenseBySelect.value)) {
        setExpenseByValueQuiet(cashExpenseByValue);
      }
    } else if (paymentType === 'Credit') {
      if (shouldForce) {
        setExpenseByValueQuiet('');
      }
    }
    if (expenseBySelect && expenseBySelect.tomselect) {
      var ets = expenseBySelect.tomselect;
      var onExpenseBy = !!(ets.control_input && document.activeElement === ets.control_input);
      if (!onExpenseBy && ets.isOpen) {
        try { ets.close(); } catch (errClose) {}
      }
    }
    window.scrollTo(0, scrollY);
    window.setTimeout(function() { window.scrollTo(0, scrollY); }, 0);
    updateExpenseByBalanceHint();
  }

  function updateExpenseByBalanceHint() {
    if (!expenseByBalanceHint || !expenseBySelect) return;
    var opt = expenseBySelect.options[expenseBySelect.selectedIndex];
    if (!opt || !opt.value) {
      expenseByBalanceHint.className = 'small mt-1 text-muted';
      expenseByBalanceHint.textContent = 'Balance: auto/default account will be used.';
      scheduleFuelTomSelectReposition();
      return;
    }
    var txt = (opt.textContent || '');
    var m = txt.match(/\|\s*Bal:\s*([+-]?\d[\d,]*(?:\.\d{1,2})?\s*(?:Dr|Cr))/i);
    if (!m) {
      expenseByBalanceHint.className = 'small mt-1 text-muted';
      expenseByBalanceHint.textContent = '';
      scheduleFuelTomSelectReposition();
      return;
    }
    var bal = m[1].trim();
    var isCr = /\bCr\b/i.test(bal);
    var hasAcct = /^acct-\d+$/.test(opt.value || '');
    expenseByBalanceHint.className = 'small mt-1 ' + (isCr ? 'text-danger' : 'text-success');
    expenseByBalanceHint.textContent = 'Current Balance: ' + bal;
    expenseByBalanceHint.style.cursor = hasAcct ? 'pointer' : 'default';
    expenseByBalanceHint.title = hasAcct ? 'Click to open ledger' : '';
    scheduleFuelTomSelectReposition();
  }

  function updateLitersFieldState() {
    if (!litersInput) return;
    var amount = parseNum(amountInput ? amountInput.value : null);
    var price = parseNum(fuelPriceInput ? fuelPriceInput.value : null);
    var autoCalc = amount != null && amount > 0 && price != null && price > 0;
    litersInput.readOnly = autoCalc;
    litersInput.disabled = autoCalc;
    litersInput.classList.toggle('bg-light', autoCalc);
    if (autoCalc) {

  function computeMpgAndLiters() {
    if (_calcFromLiters) return;
    var km = parseMetricText(kmDisplay);
    var amount = parseNum(amountInput ? amountInput.value : null);
    var price = parseNum(fuelPriceInput ? fuelPriceInput.value : null);
    if (price != null && price > 0 && amount != null && amount > 0) {
      if (litersInput) litersInput.value = (amount / price).toFixed(2);
    } else if (!(litersInput && parseNum(litersInput.value) != null)) {
      if (litersInput) litersInput.value = '';
    }
    updateLitersFieldState();
    updateMpgFromValues(km);
    updateTankCapacityWarning();
  }

  function computeFromLitersInput() {
    if (litersInput && litersInput.disabled) return;
    var liters = parseNum(litersInput ? litersInput.value : null);
    var amount = parseNum(amountInput ? amountInput.value : null);
    var price = parseNum(fuelPriceInput ? fuelPriceInput.value : null);
    if (!liters || liters <= 0) {
      computeMpgAndLiters();
      return;
    }
    _calcFromLiters = true;
    if (amount != null && amount > 0) {
      if (fuelPriceInput) {
        fuelPriceInput.value = (amount / liters).toFixed(2);
        fuelPriceInput.dataset.autoSuggested = '0';
      }
    } else if (price != null && price > 0) {
      if (amountInput) amountInput.value = (price * liters).toFixed(2);
    }
    _calcFromLiters = false;
    updateLitersFieldState();
    updateMpgFromValues(parseMetricText(kmDisplay));
    updateTankCapacityWarning();
  }

  function updateMpgFromValues(km) {
    var lit = parseNum(litersInput ? litersInput.value : null);

      if (!firstBad) firstBad = fuelingDateInput;

    var prev = parseNum(previousReadingInput ? previousReadingInput.value : null);
    var curr = parseNum(currentReadingInput ? currentReadingInput.value : null);
    if (curr == null || curr <= 0) {
      setFieldError(currentReadingInput, currentReadingError, 'Current reading is required.');
      if (!firstBad) firstBad = currentReadingInput;
    } else if (prev != null && curr <= prev) {
      setFieldError(currentReadingInput, currentReadingError, 'Current reading must be greater than previous (' + prev + ').');
      if (!firstBad) firstBad = currentReadingInput;
    }
    var amount = parseNum(amountInput ? amountInput.value : null);
    if (amount == null || amount <= 0) {
      setFieldError(amountInput, amountInputError, 'Amount cannot be 0.');
      if (!firstBad) firstBad = amountInput;
    }

    if (firstBad) {
      resetFuelPageLoadBar();
      try { firstBad.scrollIntoView({ behavior: 'smooth', block: 'center' }); firstBad.focus(); } catch (e) {}
      return false;
    }

    if (!hasFuelAttachments()) {
      showAttachmentWarningPopup();
      return false;

  function submitFuelFormWithOffline(submitter) {
    if (!fuelExpenseForm) return;
    if (!ensureFuelAttachmentsBeforeProceed()) return;
    // Offline: queue the entry (online saves go through the native path below,
    // where the server redirect renders the flash + next form, and a validation
    // failure re-renders the form with the user's values intact).
    if (window.FuelExpenseOffline && typeof window.FuelExpenseOffline.submitWithOfflineFallback === 'function' && !window.navigator.onLine) {
      fuelSubmitLocked = true;
      setFuelSubmitLoading(submitter);
      window.FuelExpenseOffline.submitWithOfflineFallback(fuelExpenseForm, submitter)
        .then(function() {
          if (!window.navigator.onLine) unlockFuelSubmit();
        })
        .catch(function(err) {
          unlockFuelSubmit();
          alert(err && err.message ? err.message : 'Save failed. Please try again.');
        });
      return;
    }
    _allowNativeSubmit = true;
    if (submitter && typeof fuelExpenseForm.requestSubmit === 'function') {
      fuelExpenseForm.requestSubmit(submitter);

    if (panel.parentElement !== inner) {

    var maxH = Math.max(160, Math.round(ir.height - inset - top));
    panel.style.position = 'absolute';
    panel.style.right = 'auto';
    panel.style.bottom = 'auto';
    panel.style.left = left + 'px';
    panel.style.top = top + 'px';
    panel.style.width = width + 'px';
    panel.style.maxWidth = width + 'px';
    if (opts.fill) {
      panel.style.height = maxH + 'px';
      panel.style.maxHeight = maxH + 'px';
    } else {
      panel.style.maxHeight = maxH + 'px';
      var naturalH = panel.scrollHeight || panel.offsetHeight || 240;

        panel.style.height = maxH + 'px';

        positionMeterMatchWarningPanel();
      }
      if (fuelAttachmentWarningPanel && !fuelAttachmentWarningPanel.classList.contains('d-none')) {
        positionFuelInfoPanel(fuelAttachmentWarningPanel, fuelCancelBtn || fuelAttachZone || fuelAttachmentFiles, { placeAbove: true });
      }
      if (fuelDuplicatePanel && !fuelDuplicatePanel.classList.contains('d-none')) {
        positionFuelInfoPanel(fuelDuplicatePanel, fuelCancelBtn || fuelSaveAddNextBtn || fuelExpenseForm, { placeAbove: true });
      }
      if (fuelKmGapPanel && !fuelKmGapPanel.classList.contains('d-none')) {
        positionFuelInfoPanel(fuelKmGapPanel, fuelCancelBtn || currentReadingInput || fuelSaveAddNextBtn || fuelExpenseForm, { placeAbove: true });
      }
      if (fuelTankCapacityPanel && !fuelTankCapacityPanel.classList.contains('d-none')) {
        positionFuelInfoPanel(fuelTankCapacityPanel, fuelCancelBtn || litersInput || amountInput || fuelSaveAddNextBtn || fuelExpenseForm, { placeAbove: true });
      }
      if (fuelPriceBenchmarkPanel && !fuelPriceBenchmarkPanel.classList.contains('d-none')) {
        positionFuelInfoPanel(fuelPriceBenchmarkPanel, fuelCancelBtn || fuelPriceInput || fuelSaveAddNextBtn || fuelExpenseForm, { placeAbove: true });
      }
      if (fuelPriceInsightsPanel && !fuelPriceInsightsPanel.classList.contains('d-none')) {
        if (isFuelMobilePreviewPage()) {
          positionFuelPanelInsidePhone(fuelPriceInsightsPanel, fuelPriceInput || fuelPriceInsightsBtn, { fill: true });
        } else if (fuelPriceInsightsBtn) {
          positionFuelInfoPanel(fuelPriceInsightsPanel, fuelPriceInsightsBtn);
        }
      }
    });
  }

  if (fuelTankCapacityPanel) {
    mountFuelFloatPanelToBody(fuelTankCapacityPanel);
  }

  if (fuelKmGapPanel) {
    mountFuelFloatPanelToBody(fuelKmGapPanel);
  }

  if (fuelPriceBenchmarkPanel) {
    mountFuelFloatPanelToBody(fuelPriceBenchmarkPanel);
  }

  if (fuelDuplicatePanel) {
    mountFuelFloatPanelToBody(fuelDuplicatePanel);
  }

  if (fuelAttachmentWarningPanel) {
    mountFuelFloatPanelToBody(fuelAttachmentWarningPanel);
    if (fuelAttachmentWarningOkBtn) {
      fuelAttachmentWarningOkBtn.addEventListener('click', function() {
        dismissAttachmentWarningPopup();
      });
      fuelAttachmentWarningOkBtn.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          dismissAttachmentWarningPopup();
        }
      });
    }
  }

  if (fuelMeterMatchPanel) {
    mountFuelFloatPanelToBody(fuelMeterMatchPanel);
  }
  if (fuelMeterMatchBackdrop) {
    mountFuelFloatPanelToBody(fuelMeterMatchBackdrop);
  }

  if (fuelScanDetailPanel) {
    mountFuelFloatPanelToBody(fuelScanDetailPanel);
  }

  if (vehicleLastEntryPanel) {
    mountFuelFloatPanelToBody(vehicleLastEntryPanel);
    initResizableVehicleEntryPanel(vehicleLastEntryPanel);
  }

  if (vehicleLastEntryStrip && vehicleLastEntryPanel) {
    vehicleLastEntryStrip.addEventListener('click', function() {
      var vid = _selectedVehicleId();
      if (!vid || vid === '0') return;
      openFuelEntryDetailPanel(vehicleLastEntryStrip, loadVehicleLastEntryDetail);
    });
    vehicleLastEntryStrip.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        vehicleLastEntryStrip.click();
      }
    });
  }

  if (fuelMarketScanStatusBar) {
    fuelMarketScanStatusBar.addEventListener('click', function() {
      var body = document.getElementById('fuelScanDetailBody');
      if (!body || !fuelScanDetailPanel) return;
      toggleFuelInfoPanel(fuelScanDetailPanel, fuelMarketScanStatusBar, function() {
        body.textContent = 'Loading...';
        fetch('/api/fuel-market-scan-trend')
          .then(function(r) { return r.json(); })
          .then(function(data) {
            var rows = (data && data.trend) ? data.trend : [];
            if (!rows.length) {
              body.innerHTML = '<span class="text-muted">No scan history available.</span>';
              positionFuelInfoPanel(fuelScanDetailPanel, fuelMarketScanStatusBar);
              return;
            }
            body.innerHTML = '<div class="mb-2"><strong>Source:</strong> ' + (data.source || 'PSO') + '</div>' +
              rows.map(function(row) {
                var line = '<div class="border-bottom py-1"><strong>' + (row.date || '-') + '</strong>';
                if (row.ok) {
                  line += '<br>Petrol: Rs ' + parseFloat(row.petrol || 0).toFixed(2) +
                    ' | Diesel: Rs ' + parseFloat(row.diesel || 0).toFixed(2);
                } else {
                  line += '<br><span class="text-danger">' + (row.error || 'Scan failed') + '</span>';
                }
                if (row.scanned_at) line += '<br><span class="text-muted">' + row.scanned_at + '</span>';
                return line + '</div>';
              }).join('');
            positionFuelInfoPanel(fuelScanDetailPanel, fuelMarketScanStatusBar);
          })
          .catch(function() {
            body.textContent = 'Unable to load scan trend.';
            positionFuelInfoPanel(fuelScanDetailPanel, fuelMarketScanStatusBar);
          });
      });
    });
    fuelMarketScanStatusBar.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fuelMarketScanStatusBar.click(); }
    });
  }

  function positionFuelPriceInsightsPanel() {
    if (!fuelPriceInsightsPanel || fuelPriceInsightsPanel.classList.contains('d-none')) return;
    if (isFuelMobilePreviewPage()) {
      positionFuelPanelInsidePhone(fuelPriceInsightsPanel, fuelPriceInput || fuelPriceInsightsBtn, { fill: true });
      return;
    }
    if (fuelPriceInsightsBtn) positionFuelInfoPanel(fuelPriceInsightsPanel, fuelPriceInsightsBtn);
  }

  if (fuelPriceInsightsBtn && fuelPriceInsightsPanel) {
    fuelPriceInsightsBtn.addEventListener('click', function(e) {
      e.preventDefault();
      e.stopPropagation();
      var isOpen = !fuelPriceInsightsPanel.classList.contains('d-none');
      if (isOpen) {
        closeFuelInfoPanel(fuelPriceInsightsPanel, fuelPriceInsightsBtn);
        return;
      }
      closeAllFuelInfoPanels();
      fetchPriceHistory();
      fuelPriceInsightsPanel.classList.remove('d-none');
      fuelPriceInsightsPanel.setAttribute('aria-hidden', 'false');
      fuelPriceInsightsBtn.classList.add('is-open');
      positionFuelPriceInsightsPanel();
    });
  }

  var fuelPsoScanNowBtn = document.getElementById('fuelPsoScanNowBtn');
  if (fuelPsoScanNowBtn) {
    fuelPsoScanNowBtn.addEventListener('click', function(e) {
      e.preventDefault();
      e.stopPropagation();
      runFuelPsoScanNow();
    });
  }

  if (fuelLastSavedBar) {
    fuelLastSavedBar.addEventListener('click', function(e) {
      if (e.target.closest('a')) return;
      var preview = null;
      try {
        var el = document.getElementById('lastSavedPreviewData');
        if (el && el.textContent) preview = JSON.parse(el.textContent);
      } catch (err) { preview = null; }
      if (!preview || !preview.id) {
        openFuelEntryDetailPanel(fuelLastSavedBar, function() {
          if (vehicleLastEntryBody) {
            vehicleLastEntryBody.innerHTML = '<span class="text-muted">No fuel expense saved yet.</span>';
          }
          if (vehicleLastEntryViewLink) vehicleLastEntryViewLink.classList.add('d-none');
          if (vehicleLastEntryEditLink) vehicleLastEntryEditLink.classList.add('d-none');
        });
        return;
      }
      openFuelEntryDetailPanel(fuelLastSavedBar, function() {
        loadFuelEntryDetailById(preview.id);
      });
    });
    fuelLastSavedBar.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fuelLastSavedBar.click(); }
    });
  }

  if (fuelAttachmentFiles) {
    document.addEventListener('paste', function(e) {
      if (!canPasteIntoFuelForm()) return;
      var items = (e.clipboardData && e.clipboardData.items) ? Array.prototype.slice.call(e.clipboardData.items) : [];
      var files = [];
      items.forEach(function(it) {
        if (it && it.kind === 'file') {
          var f = it.getAsFile();
          if (f) files.push(f);
        }
      });
      if (!files.length) return;
      appendPastedFiles(files);
      e.preventDefault();
    });
  }

  if (fuelDuplicateContinueBtn) {
    fuelDuplicateContinueBtn.addEventListener('click', continueFuelDuplicatePanel);
    fuelDuplicateContinueBtn.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        continueFuelDuplicatePanel();
      }
    });
  }
  if (fuelDuplicateCancelBtn) {
    fuelDuplicateCancelBtn.addEventListener('click', dismissFuelDuplicatePanel);
  }
  if (fuelTankCapacityContinueBtn) {
    fuelTankCapacityContinueBtn.addEventListener('click', continueFuelTankCapacityPanel);
    fuelTankCapacityContinueBtn.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        continueFuelTankCapacityPanel();
      }
    });
  }
  if (fuelTankCapacityCancelBtn) {
    fuelTankCapacityCancelBtn.addEventListener('click', dismissFuelTankCapacityPanel);
  }
  if (fuelKmGapContinueBtn) {
    fuelKmGapContinueBtn.addEventListener('click', continueFuelKmGapPanel);
    fuelKmGapContinueBtn.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        continueFuelKmGapPanel();
      }
    });
  }
  if (fuelKmGapCancelBtn) {
    fuelKmGapCancelBtn.addEventListener('click', dismissFuelKmGapPanel);
  }
  if (fuelPriceBenchmarkContinueBtn) {
    fuelPriceBenchmarkContinueBtn.addEventListener('click', continueFuelPriceBenchmarkPanel);
    fuelPriceBenchmarkContinueBtn.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        continueFuelPriceBenchmarkPanel();
      }
    });
  }
  if (fuelPriceBenchmarkCancelBtn) {
    fuelPriceBenchmarkCancelBtn.addEventListener('click', dismissFuelPriceBenchmarkPanel);
  }

  // ── Fuel Pump balance hint ────────────────────────────────────────────────
  var pumpBalanceHint = document.getElementById('pumpBalanceHint');
  function _fetchPumpBalance(partyId) {
    if (!pumpBalanceHint) return;
    if (!partyId || partyId === '0') {
      pumpBalanceHint.className = 'small mt-1 d-none';
      pumpBalanceHint.textContent = ''; pumpBalanceHint.removeAttribute('data-ledger-url');
      return;
    }
    fetch('/api/workspace-account-balance?party_id=' + encodeURIComponent(partyId))
      .then(function(r) { return r.json(); })
      .then(function(d) {
        if (!d || d.balance_str === null || d.balance_str === undefined) {
          pumpBalanceHint.className = 'small mt-1 text-muted'; pumpBalanceHint.classList.remove('d-none');
          pumpBalanceHint.textContent = 'Fuel Pump Name Balance: No account';
          pumpBalanceHint.removeAttribute('data-ledger-url');
          return;
        }
        var isCr = /\bCr\b/i.test(d.balance_str);
        pumpBalanceHint.className = 'small mt-1 ' + (isCr ? 'text-danger' : 'text-success');
        pumpBalanceHint.classList.remove('d-none');
        pumpBalanceHint.textContent = 'Fuel Pump Name Balance: ' + d.balance_str;
        pumpBalanceHint.style.cursor = d.ledger_url ? 'pointer' : 'default';
        pumpBalanceHint.title = d.ledger_url ? 'Click to open ledger' : '';
        if (d.ledger_url) pumpBalanceHint.setAttribute('data-ledger-url', d.ledger_url);
        else pumpBalanceHint.removeAttribute('data-ledger-url');
      })
      .catch(function() { pumpBalanceHint.className = 'small mt-1 d-none'; });
  }
  if (pumpBalanceHint) {
    pumpBalanceHint.addEventListener('click', function() {
      var url = this.getAttribute('data-ledger-url');
      if (url) window.open(url, '_blank');
    });
  }
  if (fuelPumpSelect) {
    fuelPumpSelect.addEventListener('change', function() { _fetchPumpBalance(this.value); });
    if (fuelPumpSelect.value && fuelPumpSelect.value !== '0') _fetchPumpBalance(fuelPumpSelect.value);
  }

  // ── Amount focus: warn if meter reading mismatch ───────────────────────
  var _matchedAlertShown = false;
  function _resetMatchedAlert() { _matchedAlertShown = false; }

  function focusCurrentReadingField() {
    if (!currentReadingInput) return;
    currentReadingInput.focus();
    if (typeof currentReadingInput.select === 'function') currentReadingInput.select();
  }

  function isMeterMatchWarningOpen() {
    return !!(fuelMeterMatchPanel && !fuelMeterMatchPanel.classList.contains('d-none'));
  }

  function focusMeterMatchOkButton() {
    if (amountInput && document.activeElement === amountInput) {
      amountInput.blur();
    }
    if (!fuelMeterMatchOkBtn) return;
    fuelMeterMatchOkBtn.focus({ preventScroll: true });
    requestAnimationFrame(function() {
      if (!isMeterMatchWarningOpen()) return;
      if (document.activeElement !== fuelMeterMatchOkBtn) {
        fuelMeterMatchOkBtn.focus({ preventScroll: true });
      }
    });
  }

  function enableMeterMatchFocusTrap() {
    if (!_meterMatchTrapHandler) {
      _meterMatchTrapHandler = function(e) {
        if (!isMeterMatchWarningOpen()) return;
        if (e.key === 'Tab') {
          e.preventDefault();
          focusMeterMatchOkButton();
          return;
        }
        if (e.key === 'Enter') {
          e.preventDefault();
          dismissMeterMatchWarning();
        }
      };
      document.addEventListener('keydown', _meterMatchTrapHandler, true);
    }
    if (!_meterMatchFocusGuard) {
      _meterMatchFocusGuard = function(e) {
        if (!isMeterMatchWarningOpen()) return;
        if (e.target === fuelMeterMatchOkBtn) return;
        if (fuelMeterMatchPanel && fuelMeterMatchPanel.contains(e.target)) return;
        if (e.target && typeof e.target.blur === 'function') {
          e.target.blur();
        }
        focusMeterMatchOkButton();
      };
      document.addEventListener('focusin', _meterMatchFocusGuard, true);
    }
  }

  function disableMeterMatchFocusTrap() {
    if (_meterMatchTrapHandler) {
      document.removeEventListener('keydown', _meterMatchTrapHandler, true);
      _meterMatchTrapHandler = null;
    }
    if (_meterMatchFocusGuard) {
      document.removeEventListener('focusin', _meterMatchFocusGuard, true);
      _meterMatchFocusGuard = null;
    }
  }

  function closeMeterMatchWarning() {
    if (fuelMeterMatchBackdrop) {
      fuelMeterMatchBackdrop.classList.remove('is-open');
      fuelMeterMatchBackdrop.setAttribute('aria-hidden', 'true');
    }
    if (fuelMeterMatchPanel) {
      fuelMeterMatchPanel.classList.add('d-none');
      fuelMeterMatchPanel.setAttribute('aria-hidden', 'true');
    }
    disableMeterMatchFocusTrap();
  }

  function dismissMeterMatchWarning() {
    closeMeterMatchWarning();
    window.setTimeout(focusCurrentReadingField, 50);
  }

  function positionMeterMatchWarningPanel() {
    if (!fuelMeterMatchPanel) return;
    mountFuelFloatPanelToBody(fuelMeterMatchPanel);
    if (fuelMeterMatchBackdrop) mountFuelFloatPanelToBody(fuelMeterMatchBackdrop);

    if (fuelMeterMatchBackdrop) {
      fuelMeterMatchBackdrop.classList.add('is-open');
      fuelMeterMatchBackdrop.setAttribute('aria-hidden', 'false');
    }

    fuelMeterMatchPanel.classList.remove('d-none');
    fuelMeterMatchPanel.setAttribute('aria-hidden', 'false');
    fuelMeterMatchPanel.style.visibility = 'hidden';

    // Mobile app: anchor the panel inside the phone shell (viewport math puts
    // it outside/behind the app bar there).
    if (isFuelMobilePreviewPage() && positionFuelPanelInsidePhone(fuelMeterMatchPanel, amountInput || currentReadingInput || fuelExpenseForm, { fill: false })) {
      fuelMeterMatchPanel.style.visibility = '';
      enableMeterMatchFocusTrap();
      focusMeterMatchOkButton();
      return;
    }

    var panelW = Math.min(480, window.innerWidth - 24);
    fuelMeterMatchPanel.style.width = panelW + 'px';
    var wrap = document.querySelector('.fuel-form-wrap');
    var left = 12;
    if (wrap) {
      left = wrap.getBoundingClientRect().left + 12;
    } else {
      left = getFuelEntryPanelLeft(panelW);
    }
    left = Math.max(12, Math.min(left, window.innerWidth - panelW - 12));
    fuelMeterMatchPanel.style.left = left + 'px';
    fuelMeterMatchPanel.style.top = getFuelPageHeaderBottom() + 'px';
    fuelMeterMatchPanel.style.visibility = '';

    enableMeterMatchFocusTrap();
    focusMeterMatchOkButton();
  }

  function showMeterMatchWarning() {
    var detailHtml = getRangeAlignmentAlertHtml();
    if (fuelMeterMatchDetail) {
      if (detailHtml) {
        fuelMeterMatchDetail.innerHTML = detailHtml;
        fuelMeterMatchDetail.classList.remove('d-none');
      } else {
        fuelMeterMatchDetail.innerHTML = '';
        fuelMeterMatchDetail.classList.add('d-none');
      }
    }
    positionMeterMatchWarningPanel();
  }

  if (fuelMeterMatchOkBtn) {
    fuelMeterMatchOkBtn.addEventListener('click', dismissMeterMatchWarning);
  }
  if (fuelMeterMatchBackdrop) {
    fuelMeterMatchBackdrop.addEventListener('click', function(e) {
      e.preventDefault();
      e.stopPropagation();
    });
  }

  if (amountInput) {
    amountInput.addEventListener('mousedown', function(e) {
      var matched = meterMatched ? (meterMatched.textContent || '').trim() : '';
      if (matched === 'No' && !_matchedAlertShown) {
        e.preventDefault();
        _matchedAlertShown = true;
        showMeterMatchWarning();
      }
    });
    amountInput.addEventListener('focus', function() {
      var matched = meterMatched ? (meterMatched.textContent || '').trim() : '';
      if (matched !== 'No') return;
      if (!_matchedAlertShown) {
        _matchedAlertShown = true;
        amountInput.blur();
        showMeterMatchWarning();
        return;
      }
      if (isMeterMatchWarningOpen()) {
        amountInput.blur();
        focusMeterMatchOkButton();
      }
    });
  }
  [vehicleSelect, currentReadingInput, fuelingDateInput].forEach(function(el) {
    if (el) el.addEventListener('change', _resetMatchedAlert);
  });
  if (currentReadingInput) currentReadingInput.addEventListener('input', _resetMatchedAlert);

  // ── Ctrl+S / Cmd+S to save ─────────────────────────────────────────────
  document.addEventListener('keydown', function(e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 's') {
      e.preventDefault();
      var btn = fuelExpenseForm ? (fuelExpenseForm.querySelector('button[name="_save_action"][value="save_add"]') || fuelExpenseForm.querySelector('[type="submit"]')) : null;
      if (btn && !btn.disabled) btn.click();
    }
  });

  // ── Auto-focus ─────────────────────────────────────────────────────────
  var _isFromSave = {{ 'true' if (from_save is defined and from_save) else 'false' }};
  window.setTimeout(function() {
    // Mobile app: no auto-focus — the fleet-wide TomSelect focus hook force-opens
    // the dropdown, which would bury the form under the district list on load.
    if (typeof isFuelMobilePreviewPage === 'function' && isFuelMobilePreviewPage()) return;
    if (_isFromSave) {
      if (fuelPumpSelect && fuelPumpSelect.tomselect) { fuelPumpSelect.tomselect.focus(); }
      else if (fuelPumpSelect) { fuelPumpSelect.focus(); }
    } else {
      if (districtSelect && districtSelect.tomselect) {
        districtSelect.tomselect.focus();
      } else if (districtSelect) {
        districtSelect.focus();
      }
    }
  }, 150);

  function revealFuelMobileForm(force) {
    var inner = document.querySelector('.fuel-phone-inner');
    if (!inner || !inner.classList.contains('fuel-booting')) return;
    if (!force) {
      var selects = inner.querySelectorAll('.fuel-row select.search-select');
      for (var i = 0; i < selects.length; i++) {
        if (!selects[i].tomselect) return;
      }
    }
    inner.classList.remove('fuel-booting');
  }
  if (isFuelMobilePreviewPage()) {
    window.setTimeout(function() { revealFuelMobileForm(false); }, 0);
    window.setTimeout(function() { revealFuelMobileForm(false); }, 50);
    window.setTimeout(function() { revealFuelMobileForm(true); }, 250);
  }
});
</script>
